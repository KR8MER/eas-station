# EAS Station Warm-Standby Docker Compose
#
# This file defines a minimal warm-standby EAS Station configuration.
# The standby node monitors the primary and can be promoted if the
# primary fails.  See STANDBY_DEPLOYMENT.md for full instructions.
#
# Usage:
#   cp .env.example .env            # configure as standby
#   edit .env: DEPLOYMENT_MODE=standby, EAS_BROADCAST_ENABLED=false
#   docker compose -f docker-compose.standby.yml up -d
#
# NOTE: This file is provided as a reference example.
#       EAS Station is primarily designed for bare-metal / systemd
#       deployment.  Adjust paths and image names for your environment.

version: "3.9"

# ---------------------------------------------------------------------------
# Shared default settings applied to every service
# ---------------------------------------------------------------------------
x-eas-defaults: &eas-defaults
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - eas-net

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ── PostgreSQL (standby replica) ─────────────────────────────────────────
  # On a real standby the database is typically replicated from the primary.
  # For the simple "backup-sync" standby pattern this can be a fresh
  # instance that is populated from the most-recent backup on startup.
  db:
    image: postgis/postgis:17-3.4-alpine
    <<: *eas-defaults
    environment:
      POSTGRES_USER: "${DB_USER:-eas_station}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME:-eas_station}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eas_station}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    <<: *eas-defaults
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── EAS Station web (standby mode) ───────────────────────────────────────
  web:
    image: "${EAS_IMAGE:-kr8mer/eas-station}:${EAS_VERSION:-latest}"
    <<: *eas-defaults
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 wsgi:application
    environment:
      DEPLOYMENT_MODE: standby
      EAS_BROADCAST_ENABLED: "false"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-data:/opt/eas-station/media
      - backups:/var/backups/eas-station

  # ── Alert poller (standby — read-only monitoring) ─────────────────────────
  poller:
    image: "${EAS_IMAGE:-kr8mer/eas-station}:${EAS_VERSION:-latest}"
    <<: *eas-defaults
    command: python poller/cap_poller.py
    environment:
      DEPLOYMENT_MODE: standby
      EAS_BROADCAST_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Backup synchroniser ───────────────────────────────────────────────────
  # Pulls backup archives from the primary node so this standby can be
  # promoted quickly.  Runs rsync on a 5-minute schedule.
  backup-sync:
    image: alpine:3.19
    <<: *eas-defaults
    environment:
      PRIMARY_HOST: "${PRIMARY_HOST:-primary-eas-station}"
      PRIMARY_BACKUP_DIR: "${PRIMARY_BACKUP_DIR:-/var/backups/eas-station}"
      SYNC_INTERVAL: "${SYNC_INTERVAL:-300}"
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c '
        apk add --no-cache rsync openssh-client &&
        while true; do
          echo "[backup-sync] Syncing from $$PRIMARY_HOST..." &&
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            "$$PRIMARY_HOST:$$PRIMARY_BACKUP_DIR/" /backups/ \
            && echo "[backup-sync] Sync complete" \
            || echo "[backup-sync] Sync FAILED" ;
          sleep "$$SYNC_INTERVAL" ;
        done
      '

  # ── nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    <<: *eas-defaults
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-standby.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      - web

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  db-data:
  redis-data:
  media-data:
  backups:
  certs:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  eas-net:
    driver: bridge
