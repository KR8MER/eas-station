<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- gpsd: GPS daemon. Satellite body with two solar panels + downlink
       signal cone toward Earth, representing the project's role as the
       userland multiplexer for GNSS receivers. -->
