<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- pydub: audio manipulation. Stylised waveform bars of varying height,
       the universal "audio sample" mark. -->
  <rect x="3"  y="10" width="2.4" height="4"  fill="#FFFFFF"/>
  <rect x="6.5" y="7"  width="2.4" height="10" fill="#FFFFFF"/>
  <rect x="10"   y="4"  width="2.4" height="16" fill="#FFFFFF"/>
  <rect x="13.5" y="8"  width="2.4" height="8"  fill="#FFFFFF"/>
  <rect x="17"   y="6"  width="2.4" height="12" fill="#FFFFFF"/>
  <rect x="20.5" y="10" width="2.4" height="4"  fill="#FFFFFF"/>
</svg>
