# EAS Station Nginx Configuration for Bare Metal Deployment
# This file should be placed in /etc/nginx/sites-available/eas-station
# and symlinked to /etc/nginx/sites-enabled/
#
# Requires nginx 1.25.1 or newer for http2 directive support

# Upstream backend server
upstream eas_station_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Flood control zones (per-client-IP). General API traffic gets a generous
# cap that only bites during a runaway client-side polling loop or a scan --
# legitimate dashboard polling (broadcast_state at 1s, alerts at 5s, etc.,
# see static/js/core/websocket.js FALLBACK_INTERVALS) sits well under it.
# /login gets a much tighter cap to slow credential-stuffing.
limit_req_zone $binary_remote_addr zone=eas_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=eas_login:10m rate=5r/m;

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL configuration - Self-signed certificate (generated during installation)
    ssl_certificate /etc/ssl/certs/eas-station-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/eas-station-selfsigned.key;
    
    # Let's Encrypt configuration (uncomment after running certbot)
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client body size. Set above the app's own MAX_CONTENT_LENGTH (100 MB,
    # app.py) so normal oversized uploads are rejected by Flask itself --
    # which renders a proper branded error page via its 413 handler -- and
    # this nginx-level limit only acts as a hard backstop against truly
    # extreme payloads. That split matters specifically for HTTP/2: nginx's
    # own client_max_body_size check happens at the protocol/framing layer
    # and returns a bare, unstyled 413 that bypasses error_page entirely (a
    # documented nginx limitation, still present as of 1.26) -- but a normal
    # over-the-limit response from the app behind it is just an ordinary
    # HTTP response, unaffected by that quirk, whether the client used
    # HTTP/1.1 or HTTP/2. The static error_page 413 page below is kept as a
    # fallback for payloads that exceed even this raised nginx limit.
    client_max_body_size 110M;

    # Performance: serve static files with sendfile + tcp_nopush, and gzip
    # text-based responses so a Pi-class CPU doesn't have to push hundreds of
    # kilobytes of raw HTML/CSS/JS over the wire on every page load.  The
    # styles.css/vendor.css files alone shrink ~75% with gzip.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Timeouts for long-running requests
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Known-scanner bait: EAS Station is a pure Python/Flask app, so none of
    # these paths are ever legitimate here -- they're mass-scanner probes for
    # WordPress admin/REST endpoints, leaked .env/.git files, PHP shells, and
    # similar. Reject before they reach the app (and its /login redirect
    # catch-all, which was rendering a full 29KB page for every one of these).
    # 444 is nginx-specific: close the connection with no response at all.
    location ~* (wp-admin|wp-login|wp-json|wp-content|wp-includes|wordpress|xmlrpc\.php|\.env|\.git/|phpmyadmin|/\.docker/|/cgi-bin/|\.php$) {
        return 444;
    }

    # Proxy to Flask application
    location / {
        proxy_pass http://eas_station_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        # HTTP/1.1 for keep-alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Flood control: general per-IP cap on API traffic. burst=40 absorbs a
    # normal page's simultaneous polls (broadcast_state @1s, alerts @5s, etc.)
    # and short bursts on load; nodelay lets those through immediately rather
    # than queuing, only excess above the burst gets 503'd. More specific
    # /api/... locations below (streaming, audio) still take precedence.
    location /api/ {
        limit_req zone=eas_api burst=40 nodelay;

        proxy_pass http://eas_station_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Flood control: strict per-IP cap on login attempts to slow
    # credential-stuffing / brute force.
    location = /login {
        limit_req zone=eas_login burst=5 nodelay;

        proxy_pass http://eas_station_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # WebSocket support for Socket.IO
    location /socket.io/ {
        proxy_pass http://eas_station_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Audio streaming - proxy to audio service (port 5002)
    location /api/audio/stream/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;

        # Streaming-specific settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical: Disable ALL buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # Long timeout for continuous streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # CORS headers for audio playback
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # EAS decoder stream - proxy to audio service (port 5002)
    location /api/eas/decoder-stream {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;

        # Streaming-specific settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical: Disable ALL buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # Long timeout for continuous streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # CORS headers for audio playback
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # EAS decoder monitor streams - 16 kHz audio fed to the EAS decoder, one per source.
    # Mount points follow the pattern /{stream_name_prefix}-{source-name}.mp3 and are
    # configured via Admin → EAS Decoder Monitor.  This regex block proxies all of them
    # through to the local Icecast server on port 8000.
    location ~* ^/(eas-[a-z0-9_-]+\.mp3)$ {
        proxy_pass http://127.0.0.1:8000/$1;
        proxy_http_version 1.1;

        # Streaming-specific settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical: Disable ALL buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # Long timeout for continuous streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # CORS headers for audio playback
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Per-source live monitoring streams (Icecast MP3 mounts), e.g.
    # /sdr-wbks.mp3, /wnci.mp3 -- one per configured audio source, named by
    # app_core/audio/mount_points.py's sanitize_mount_name(). Used by the
    # audio-monitor page's inline <audio> players. Without this block these
    # fell through to location / (the Flask app), which has no route for
    # them and redirects to /login -- the actual cause of "play does
    # nothing" on that page. Same Icecast backend as the eas-*.mp3 block
    # above (a separate feature -- 16kHz decoder-monitor feeds); the
    # negative lookahead keeps this block from also matching that one's
    # mount names, so which block "wins" doesn't depend on file order.
    location ~* ^/(?!eas-)([a-z0-9_-]+\.mp3)$ {
        proxy_pass http://127.0.0.1:8000/$1;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Static files (served directly by nginx for better performance)
    location /static/ {
        alias /opt/eas-station/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gateway-down page: shown instead of nginx's stock error page whenever
    # the Flask app (gunicorn, port 5000) can't be reached or times out --
    # e.g. mid-restart after a deploy, or crashed. Must be served directly by
    # nginx (not proxied) since the whole point is it still renders when the
    # backend is down; it lives under /static/ so it's on the same
    # nginx-serves-directly path already used above, and pulls in no other
    # asset that could itself be unreachable. `internal` keeps it from being
    # requested directly as a normal page.
    error_page 502 503 504 /static/errors/gateway-down.html;
    location = /static/errors/gateway-down.html {
        internal;
        alias /opt/eas-station/static/errors/gateway-down.html;
    }

    # Upload-too-large fallback page: only reached for a body over this
    # server's own client_max_body_size (110M, set above), which is a hard
    # backstop above the app's real MAX_CONTENT_LENGTH (100 MB). A normal
    # oversized upload is instead rejected by Flask itself with a proper
    # branded page -- see the client_max_body_size comment above for why
    # that split exists (nginx's own 413 doesn't render this page at all
    # over HTTP/2; see also app.py's MAX_CONTENT_LENGTH comment). This page
    # is what a client sees only if it exceeds even the raised nginx limit,
    # over HTTP/1.1 -- and must be served directly rather than proxied,
    # same reasoning as the gateway-down page above.
    error_page 413 /static/errors/upload-too-large.html;
    location = /static/errors/upload-too-large.html {
        internal;
        alias /opt/eas-station/static/errors/upload-too-large.html;
    }

    # Access and error logs
    access_log /var/log/nginx/eas-station-access.log;
    error_log /var/log/nginx/eas-station-error.log;
}
