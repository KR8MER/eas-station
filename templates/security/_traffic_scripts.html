{# Traffic Analytics dashboard scripts — the body of the former
   traffic_dashboard.html scripts block (Chart.js / Leaflet / jsPDF +
   dashboard logic). Loaded by the Security Center page. #}
<script src="{{ url_for('static', filename='vendor/chartjs/chart-v3.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/core/map_theme.js') }}?v={{ static_asset_version }}"></script>
<script src="{{ url_for('static', filename='js/data/country_centroids.js') }}"></script>
<script src="{{ url_for('static', filename='js/data/us_state_centroids.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/jspdf/jspdf.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/jspdf/html2canvas.min.js') }}"></script>
<script>
    let charts = {};
    let lastDashboardData = null;  // most recent payload, for CSV/PDF export

    // ----- Custom date range + drill-down filter state -----
    // Drill-down dimensions currently applied (key -> value).
    const activeFilters = {};
    // Dimension keys the dashboard understands (must match TrafficFilters).
    const FILTER_KEYS = ['path', 'path_prefix', 'ip', 'country', 'country_code', 'browser', 'os', 'method', 'status_family'];
    const FILTER_LABELS = {
        path: 'Path', path_prefix: 'Path starts with', ip: 'IP', country: 'Country',
        country_code: 'Country', browser: 'Browser', os: 'OS', method: 'Method', status_family: 'Status'
    };

    // Build the query string for /api/traffic/dashboard from the range + filters.
    function buildQuery() {
        const params = new URLSearchParams();
        const sel = document.getElementById('rangeSelect');
        if (sel.value === 'custom') {
            const start = document.getElementById('rangeStart').value;
            const end = document.getElementById('rangeEnd').value;
            if (start) params.set('start', start);
            if (end) params.set('end', end);
            if (!start && !end) params.set('days', '30');
        } else {
            params.set('days', sel.value);
        }
        FILTER_KEYS.forEach(k => {
            if (activeFilters[k] !== undefined && activeFilters[k] !== null && activeFilters[k] !== '') {
                params.set(k, activeFilters[k]);
            }
        });
        return params.toString();
    }

    function applyCustomRange() { loadDashboard(); }

    function addFilter(key, value) {
        if (!key || value === undefined || value === null || value === '') return;
        // status_family arrives as "4xx" or 4 — normalise to the leading digit.
        if (key === 'status_family') value = String(value).replace(/[^0-9]/g, '').slice(0, 1);
        activeFilters[key] = value;
        loadDashboard();
    }
    function removeFilter(key) { delete activeFilters[key]; loadDashboard(); }
    function clearFilters() { FILTER_KEYS.forEach(k => delete activeFilters[k]); loadDashboard(); }

    // Render the active-filter chip bar from the server's echoed filter_meta
    // (so the chips always reflect what the data was actually filtered by).
    function renderFilterChips(meta) {
        const bar = document.getElementById('activeFilters');
        if (!bar) return;
        const chips = (meta && meta.dimensions) || [];
        if (!chips.length) { bar.classList.add('d-none'); bar.innerHTML = ''; return; }
        bar.classList.remove('d-none');
        let html = '<span class="fb-label"><i class="fas fa-filter me-1"></i>Filtered by</span>';
        chips.forEach(c => {
            // Map the server dimension key back to our request key (ip_address->ip, country_code->country_code).
            const reqKey = c.key === 'ip_address' ? 'ip' : c.key;
            html += `<span class="filter-chip"><span class="fc-key">${escapeHtml(c.label)}:</span> ${escapeHtml(c.value)} `
                + `<button type="button" title="Remove" onclick="removeFilter('${escapeHtml(reqKey)}')">&times;</button></span>`;
        });
        html += `<button type="button" class="btn btn-sm btn-outline-secondary ms-1" onclick="clearFilters()"><i class="fas fa-times me-1"></i>Clear all</button>`;
        bar.innerHTML = html;
    }

    // Render the detected-anomalies banner.
    function renderAnomalies(list) {
        const panel = document.getElementById('anomalyPanel');
        if (!panel) return;
        list = list || [];
        if (!list.length) { panel.classList.add('d-none'); panel.innerHTML = ''; return; }
        panel.classList.remove('d-none');
        const iconFor = { critical: 'fa-circle-exclamation', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
        let html = '<div class="anomaly-list">';
        list.forEach(a => {
            const sev = a.severity || 'info';
            const drill = a.drilldown
                ? ` <a href="#" class="small" onclick='applyAnomalyDrill(${JSON.stringify(a.drilldown)}); return false;'>Investigate →</a>`
                : '';
            html += `<div class="anomaly-item sev-${escapeHtml(sev)}">`
                + `<i class="fas ${iconFor[sev] || 'fa-circle-info'} ai-icon"></i>`
                + `<div><div class="ai-title">${escapeHtml(a.title || '')}</div>`
                + `<div class="ai-detail">${escapeHtml(a.detail || '')}${drill}</div></div></div>`;
        });
        html += '</div>';
        panel.innerHTML = html;
    }
    function applyAnomalyDrill(d) {
        if (!d) return;
        Object.entries(d).forEach(([k, v]) => { activeFilters[k] = String(v); });
        loadDashboard();
    }

    // ----- Per-table client-side search (text filter over rendered rows) -----
    const TABLE_SEARCHES = {
        searchTopPages: 'topPages', searchTopVisitors: 'topVisitors',
        searchRecent: 'recentRequests', searchErrorPages: 'errorPages'
    };
    function applyTableSearch(inputId, tbodyId) {
        const input = document.getElementById(inputId);
        const tb = document.getElementById(tbodyId);
        if (!input || !tb) return;
        const term = (input.value || '').toLowerCase();
        tb.querySelectorAll('tr').forEach(tr => {
            tr.style.display = (!term || tr.textContent.toLowerCase().includes(term)) ? '' : 'none';
        });
    }
    function applyAllTableSearches() {
        Object.entries(TABLE_SEARCHES).forEach(([i, t]) => applyTableSearch(i, t));
    }

    function cssVar(name, fallback) {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return v || fallback;
    }
    function num(n) { return (n || 0).toLocaleString(); }
    // Real flag IMAGE for an ISO 3166-1 alpha-2 code. Emoji flags don't render on
    // Windows (it shows the letters instead), so we use bundled flag-icons SVGs
    // served locally — works on every OS, no external/CDN calls.
    const FLAG_BASE = "{{ url_for('static', filename='vendor/flags') }}".split('?')[0];
    function flagImg(cc, title) {
        if (!cc || !/^[A-Za-z]{2}$/.test(cc)) return '';
        const c = cc.toLowerCase();
        return `<img src="${FLAG_BASE}/${c}.svg" alt="${escapeHtml(cc.toUpperCase())}" title="${escapeHtml(title || cc.toUpperCase())}" class="ti-flag me-1" loading="lazy">`;
    }
    // Build a "🇺🇸 United States" style label; falls back to a network icon for
    // local/unresolved labels that have no country code.
    function flagLabel(cc, label) {
        const text = escapeHtml(label || 'Unknown');
        const flag = flagImg(cc, label);
        if (flag) return `${flag}${text}`;
        return `<i class="fas fa-network-wired text-muted me-1" title="Local / unresolved"></i>${text}`;
    }
    // Two-line IP cell: reverse-DNS hostname on top (with country flag) and the
    // raw IP beneath. Falls back to just the IP when no PTR record is known.
    // Shared by the visitor, error-source and login-security tables so every IP
    // renders identically.
    function ipHostCell(r) {
        const ip = r.ip_address || '--';
        const flag = r.country_code ? flagImg(r.country_code, r.country || r.country_code) : '';
        if (r.hostname) {
            return `<div class="text-break-anywhere">${flag}${escapeHtml(r.hostname)}</div>`
                + `<div class="text-muted small mono text-break-anywhere">${escapeHtml(ip)}</div>`;
        }
        return `<span class="text-break-anywhere mono">${flag}${escapeHtml(ip)}</span>`;
    }
    // Multicolor brand logos (SVG assets) with a FontAwesome brand glyph as the
    // fallback. `color` tints the fallback glyph; `logo` is a true-color image.
    // Strip any ?v= cache-buster the static URL handler appends, so per-file
    // names append to the path cleanly (…/logos/chrome.svg) instead of landing
    // in the query string (…/logos?v=X/chrome.svg → 403).
    const LOGO_BASE = "{{ url_for('static', filename='img/logos') }}".split('?')[0];
    const LOGO_VER = "{{ static_asset_version }}";
    const BROWSER_META = {
        'Chrome': { icon: 'fab fa-chrome', color: '#4285F4', logo: 'chrome.svg' },
        'Firefox': { icon: 'fab fa-firefox-browser', color: '#FF7139', logo: 'firefox.svg' },
        'Edge': { icon: 'fab fa-edge', color: '#34a3e0', logo: 'edge.svg' },
        'Safari': { icon: 'fab fa-safari', color: '#1B9AF7', logo: 'safari.svg' },
        'Opera': { icon: 'fab fa-opera', color: '#FF1B2D', logo: 'opera.svg' },
        'Samsung Internet': { icon: 'fas fa-mobile-screen', color: '#7b8cff' },
        'Internet Explorer': { icon: 'fab fa-internet-explorer', color: '#34a3e0' },
    };
    const OS_META = {
        'Windows': { icon: 'fab fa-windows', color: '#2f9be0', logo: 'windows.svg' },
        'iOS': { icon: 'fab fa-apple', color: '#adb5bd', logo: 'apple.svg' },
        'iPadOS': { icon: 'fab fa-apple', color: '#adb5bd', logo: 'apple.svg' },
        'macOS': { icon: 'fab fa-apple', color: '#adb5bd', logo: 'apple.svg' },
        'Android': { icon: 'fab fa-android', color: '#3DDC84', logo: 'android.svg' },
        'ChromeOS': { icon: 'fab fa-chrome', color: '#4285F4', logo: 'chrome.svg' },
        'Linux': { icon: 'fab fa-linux', color: '#f6c343', logo: 'linux.svg' },
    };
    function browserMeta(name) {
        return BROWSER_META[name] || { icon: 'fas fa-window-maximize', color: '' };
    }
    function osMeta(name) {
        if (name && name.indexOf('Windows') === 0) return OS_META['Windows'];
        return OS_META[name] || { icon: 'fas fa-desktop', color: '' };
    }
    // HTML for a logo mark: a multicolor SVG when available, else a tinted glyph.
    function markFor(meta, label, cls) {
        const sz = cls || 'me-2';
        if (meta.logo) {
            return `<img src="${LOGO_BASE}/${meta.logo}?v=${LOGO_VER}" alt="${escapeHtml(label || '')}" class="ti-logo ${sz}">`;
        }
        const color = meta.color || 'var(--text-secondary, #888)';
        return `<i class="${meta.icon} ${sz}" style="color:${color}"></i>`;
    }
    // Render a logo mark + label.
    function iconLabel(meta, label) {
        return `${markFor(meta, label)}${escapeHtml(label || 'Unknown')}`;
    }

    // ----- Logos for file types, bots, languages, referrers, search engines -----
    // We deliberately use bundled FontAwesome glyphs (no external favicon/CDN
    // calls) so the page stays fully self-hosted, matching the browser/OS logos.
    function glyph(icon, color) {
        const c = color || 'var(--text-secondary, #888)';
        return `<i class="${icon} ti-glyph me-2" style="color:${c}"></i>`;
    }
    // File extension -> coloured FontAwesome file glyph.
    const FILETYPE_META = {
        'html': ['fas fa-file-code', '#e44d26'], 'htm': ['fas fa-file-code', '#e44d26'],
        'css': ['fas fa-file-code', '#2965f1'], 'js': ['fas fa-file-code', '#f0db4f'],
        'json': ['fas fa-file-code', '#8bc34a'], 'xml': ['fas fa-file-code', '#ff7043'],
        'png': ['fas fa-file-image', '#26a69a'], 'jpg': ['fas fa-file-image', '#26a69a'],
        'jpeg': ['fas fa-file-image', '#26a69a'], 'gif': ['fas fa-file-image', '#26a69a'],
        'svg': ['fas fa-file-image', '#ffb300'], 'webp': ['fas fa-file-image', '#26a69a'],
        'ico': ['fas fa-file-image', '#90a4ae'], 'pdf': ['fas fa-file-pdf', '#e53935'],
        'csv': ['fas fa-file-csv', '#43a047'], 'xlsx': ['fas fa-file-excel', '#1d6f42'],
        'zip': ['fas fa-file-zipper', '#fbc02d'], 'gz': ['fas fa-file-zipper', '#fbc02d'],
        'mp3': ['fas fa-file-audio', '#7e57c2'], 'wav': ['fas fa-file-audio', '#7e57c2'],
        'ogg': ['fas fa-file-audio', '#7e57c2'], 'mp4': ['fas fa-file-video', '#5c6bc0'],
        'woff': ['fas fa-font', '#6d4c41'], 'woff2': ['fas fa-font', '#6d4c41'],
        'ttf': ['fas fa-font', '#6d4c41'], 'txt': ['fas fa-file-lines', '#90a4ae'],
        'map': ['fas fa-map', '#90a4ae'],
        '(page)': ['fas fa-file-lines', 'var(--primary-color, #4e73df)'],
        '(other)': ['fas fa-file', '#90a4ae'],
    };
    // True-colour brand/language logos (self-hosted SVGs) for the common file
    // types, matching the browser/OS logo treatment. Anything without a logo
    // falls back to the coloured FontAwesome glyph in FILETYPE_META.
    const FILETYPE_LOGO = {
        'php': 'php.svg',
        'js': 'javascript.svg', 'mjs': 'javascript.svg', 'cjs': 'javascript.svg',
        'json': 'json.svg',
        'py': 'python.svg',
        'svg': 'svg.svg',
        'md': 'markdown.svg', 'markdown': 'markdown.svg',
        'html': 'html.svg', 'htm': 'html.svg',
        'css': 'css.svg',
    };
    function fileTypeLabel(ext) {
        const key = (ext || '').toLowerCase();
        const logo = FILETYPE_LOGO[key];
        if (logo) {
            return `<img src="${LOGO_BASE}/${logo}?v=${LOGO_VER}" alt="${escapeHtml(ext || '')}" class="ti-logo me-2">`
                + `<span class="mono">${escapeHtml(ext || 'Unknown')}</span>`;
        }
        const m = FILETYPE_META[key] || ['fas fa-file', '#90a4ae'];
        return `${glyph(m[0], m[1])}<span class="mono">${escapeHtml(ext || 'Unknown')}</span>`;
    }
    // Known crawler -> brand glyph + colour; substring match on the bot name.
    const BOT_META = [
        ['google', 'fab fa-google', '#4285F4'], ['bing', 'fab fa-microsoft', '#008373'],
        ['yandex', 'fas fa-y', '#ff0000'], ['baidu', 'fas fa-paw', '#2932e1'],
        ['duckduck', 'fas fa-duck', '#de5833'], ['apple', 'fab fa-apple', '#adb5bd'],
        ['facebook', 'fab fa-facebook', '#1877f2'], ['meta', 'fab fa-meta', '#0668E1'],
        ['twitter', 'fab fa-x-twitter', '#000'], ['x-', 'fab fa-x-twitter', '#000'],
        ['linkedin', 'fab fa-linkedin', '#0a66c2'], ['slack', 'fab fa-slack', '#4a154b'],
        ['discord', 'fab fa-discord', '#5865f2'], ['telegram', 'fab fa-telegram', '#26a5e4'],
        ['amazon', 'fab fa-amazon', '#ff9900'], ['gpt', 'fas fa-robot', '#10a37f'],
        ['openai', 'fas fa-robot', '#10a37f'], ['claude', 'fas fa-robot', '#d97757'],
        ['anthropic', 'fas fa-robot', '#d97757'], ['ahrefs', 'fas fa-spider', '#ff8800'],
        ['semrush', 'fas fa-spider', '#ff642d'], ['uptime', 'fas fa-heart-pulse', '#3fb950'],
        ['pingdom', 'fas fa-heart-pulse', '#fdb515'], ['curl', 'fas fa-terminal', '#90a4ae'],
        ['python', 'fab fa-python', '#3776ab'], ['go-http', 'fas fa-terminal', '#00add8'],
    ];
    function botLabel(name) {
        const lc = (name || '').toLowerCase();
        for (const [needle, icon, color] of BOT_META) {
            if (lc.indexOf(needle) !== -1) return `${glyph(icon, color)}${escapeHtml(name)}`;
        }
        return `${glyph('fas fa-robot', '#8b949e')}${escapeHtml(name || 'Unknown')}`;
    }
    // Accept-Language value -> representative country flag. Maps the language's
    // region (en-US -> US) or a sensible default region for the base language.
    const LANG_DEFAULT_REGION = {
        en: 'US', es: 'ES', fr: 'FR', de: 'DE', it: 'IT', pt: 'BR', nl: 'NL',
        ru: 'RU', zh: 'CN', ja: 'JP', ko: 'KR', ar: 'SA', hi: 'IN', tr: 'TR',
        pl: 'PL', sv: 'SE', da: 'DK', fi: 'FI', no: 'NO', cs: 'CZ', el: 'GR',
        he: 'IL', th: 'TH', vi: 'VN', id: 'ID', uk: 'UA', ro: 'RO', hu: 'HU',
    };
    function langLabel(language) {
        if (!language) return `${glyph('fas fa-globe', '#8b949e')}Unknown`;
        const parts = String(language).split(/[-_]/);
        const base = (parts[0] || '').toLowerCase();
        const region = (parts[1] || LANG_DEFAULT_REGION[base] || '').toUpperCase();
        const flag = /^[A-Z]{2}$/.test(region) ? flagImg(region, language) : '';
        const mark = flag || glyph('fas fa-language', 'var(--text-secondary,#888)');
        return `${mark}<span class="mono">${escapeHtml(language)}</span>`;
    }
    // Referring domain -> brand glyph (known sites) with a globe fallback. No
    // external favicon fetch — keeps every visitor's referrer private/local.
    const REFERRER_META = [
        ['google', 'fab fa-google', '#4285F4'], ['youtube', 'fab fa-youtube', '#ff0000'],
        ['bing', 'fab fa-microsoft', '#008373'], ['duckduckgo', 'fas fa-magnifying-glass', '#de5833'],
        ['facebook', 'fab fa-facebook', '#1877f2'], ['instagram', 'fab fa-instagram', '#e4405f'],
        ['reddit', 'fab fa-reddit', '#ff4500'], ['github', 'fab fa-github', 'var(--text-color,#888)'],
        ['twitter', 'fab fa-x-twitter', 'var(--text-color,#000)'], ['t.co', 'fab fa-x-twitter', 'var(--text-color,#000)'],
        ['linkedin', 'fab fa-linkedin', '#0a66c2'], ['wikipedia', 'fab fa-wikipedia-w', 'var(--text-color,#888)'],
        ['stackoverflow', 'fab fa-stack-overflow', '#f48024'], ['yahoo', 'fab fa-yahoo', '#6001d2'],
        ['yandex', 'fas fa-magnifying-glass', '#ff0000'], ['telegram', 'fab fa-telegram', '#26a5e4'],
        ['discord', 'fab fa-discord', '#5865f2'], ['pinterest', 'fab fa-pinterest', '#e60023'],
    ];
    function referrerLabel(domain) {
        const lc = (domain || '').toLowerCase();
        for (const [needle, icon, color] of REFERRER_META) {
            if (lc.indexOf(needle) !== -1) return `${glyph(icon, color)}<span class="text-break-anywhere">${escapeHtml(domain)}</span>`;
        }
        return `${glyph('fas fa-globe', '#8b949e')}<span class="text-break-anywhere">${escapeHtml(domain || 'Unknown')}</span>`;
    }
    const SEARCH_ENGINE_META = {
        'Google': ['fab fa-google', '#4285F4'], 'Bing': ['fab fa-microsoft', '#008373'],
        'DuckDuckGo': ['fas fa-magnifying-glass', '#de5833'], 'Yahoo': ['fab fa-yahoo', '#6001d2'],
        'Yandex': ['fas fa-magnifying-glass', '#ff0000'], 'Baidu': ['fas fa-paw', '#2932e1'],
        'Ecosia': ['fas fa-leaf', '#3fb950'], 'Startpage': ['fas fa-shield-halved', '#5c6bc0'],
        'Brave': ['fab fa-brave', '#fb542b'], 'Ask': ['fas fa-question', '#d50000'],
        'AOL': ['fas fa-circle', '#0a8dff'],
    };
    function searchEngineMeta(name) {
        return SEARCH_ENGINE_META[name] || ['fas fa-magnifying-glass', '#8b949e'];
    }
    // Human-readable byte size (awstats bandwidth column).
    function fmtBytes(n) {
        if (!n) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let i = 0, v = n;
        while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
        return `${v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)} ${units[i]}`;
    }
    function statusBadge(code) {
        const cls = code >= 500 ? 'bg-danger' : code >= 400 ? 'bg-warning text-dark'
            : code >= 300 ? 'bg-info text-dark' : 'bg-success';
        return `<span class="badge ${cls}">${code}</span>`;
    }
    function setTile(id, value, sub) {
        const tile = document.getElementById(id);
        if (!tile) return;
        tile.querySelector('.val').textContent = value;
        if (sub !== undefined) tile.querySelector('.sub').textContent = sub;
    }
    // Render a "vs previous period" delta badge inside a tile. `invert` flips the
    // colour for metrics where lower is better (response time, errors).
    function setDelta(id, cur, prev, invert) {
        const tile = document.getElementById(id);
        if (!tile) return;
        let el = tile.querySelector('.hs-delta');
        if (!el) {
            el = document.createElement('div');
            el.className = 'hs-delta';
            tile.appendChild(el);
        }
        cur = cur || 0; prev = prev || 0;
        if (!prev) {
            // No baseline to compare against — show nothing rather than a fake ∞.
            el.className = 'hs-delta flat';
            el.innerHTML = '<i class="fas fa-minus"></i> —';
            return;
        }
        const pct = ((cur - prev) / prev) * 100;
        const rounded = Math.round(pct * 10) / 10;
        let dir = rounded > 0 ? 'up' : rounded < 0 ? 'down' : 'flat';
        // Colour by goodness: for "invert" metrics, an increase is bad.
        let good = invert ? rounded < 0 : rounded > 0;
        const cls = rounded === 0 ? 'flat' : (good ? 'up' : 'down');
        const arrow = rounded > 0 ? 'fa-arrow-up' : rounded < 0 ? 'fa-arrow-down' : 'fa-minus';
        el.className = `hs-delta ${cls}`;
        el.innerHTML = `<i class="fas ${arrow}"></i> ${rounded > 0 ? '+' : ''}${rounded}% vs prev`;
    }
    // Draw a minimal sparkline (no axes/legend) into a canvas appended to a tile.
    function sparkline(id, series, color) {
        const tile = document.getElementById(id);
        if (!tile || !series || !series.length) return;
        // Canvas lives inside a fixed-height wrapper so Chart.js has a bounded
        // parent — otherwise a responsive/maintainAspectRatio:false canvas grows
        // its own height every layout pass and stretches the page indefinitely.
        let wrap = tile.querySelector('.hs-spark-wrap');
        let canvas;
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.className = 'hs-spark-wrap';
            canvas = document.createElement('canvas');
            canvas.className = 'hs-spark';
            wrap.appendChild(canvas);
            tile.appendChild(wrap);
        } else {
            canvas = wrap.querySelector('canvas.hs-spark');
        }
        const key = 'spark_' + id;
        destroyChart(key);
        const col = color || cssVar('--primary-color', '#4e73df');
        charts[key] = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: { labels: series.map((_, i) => i), datasets: [{
                data: series, borderColor: col, borderWidth: 1.5, pointRadius: 0,
                fill: true, backgroundColor: col + '22', tension: 0.35 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: { x: { display: false }, y: { display: false } } }
        });
    }
    function renderSparklines(ts) {
        if (!ts) return;
        sparkline('hs-pageviews', ts.page_views, cssVar('--info-color', '#36b9cc'));
        sparkline('hs-visitors', ts.visitors, cssVar('--primary-color', '#4e73df'));
        sparkline('hs-hits', ts.hits, cssVar('--success-color', '#1cc88a'));
    }
    function destroyChart(key) { if (charts[key]) { charts[key].destroy(); delete charts[key]; } }
    function pingLiveDot() {
        const dot = document.getElementById('traffic-live-dot');
        if (!dot) return;
        dot.classList.remove('ping'); void dot.offsetWidth; dot.classList.add('ping');
    }

    async function loadDashboard() {
        try {
            const resp = await fetch('/api/traffic/dashboard?' + buildQuery());
            const data = await resp.json();
            const errBox = document.getElementById('traffic-error');
            if (!data.success) {
                errBox.textContent = 'Failed to load traffic data: ' + (data.error || 'unknown');
                errBox.classList.remove('d-none');
                return;
            }

    function fmtDuration(sec) {
        sec = Math.round(sec || 0);
        if (sec < 60) return sec + 's';
        const m = Math.floor(sec / 60), s = sec % 60;
        if (m < 60) return `${m}m ${s}s`;
        const h = Math.floor(m / 60);
        return `${h}h ${m % 60}m`;
    }

    function renderStrip(s, l, prev) {
        setTile('hs-pageviews', num(s.page_views), 'in window');
        setTile('hs-visitors', num(s.unique_visitors), 'unique IPs');
        setTile('hs-hits', num(s.total_hits), `${num(s.bot_hits)} bot hits`);
        setTile('hs-last24', num(s.hits_last_24h), 'hits');
        setTile('hs-logins', num(l.successful_logins), `${num(l.failed_logins)} failed`);
        setTile('hs-sessions', num(l.active_sessions), 'active now');
        setTile('hs-response', s.avg_response_ms != null ? s.avg_response_ms + ' ms' : '--', `${num(s.error_hits)} errors`);
        setTile('hs-bandwidth', fmtBytes(s.total_bytes), s.avg_bytes != null ? `~${fmtBytes(s.avg_bytes)}/req` : 'served');
        // "vs previous period" deltas (where a prior baseline exists).
        if (prev) {
            setDelta('hs-pageviews', s.page_views, prev.page_views);
            setDelta('hs-visitors', s.unique_visitors, prev.unique_visitors);
            setDelta('hs-hits', s.total_hits, prev.total_hits);
            setDelta('hs-response', s.avg_response_ms, prev.avg_response_ms, true);
            setDelta('hs-bandwidth', s.total_bytes, prev.total_bytes);
        }
        // Severity tints
        const errTile = document.getElementById('hs-response');
        errTile.classList.toggle('sev-warn', (s.error_hits || 0) > 0);
        const loginTile = document.getElementById('hs-logins');
        loginTile.classList.toggle('sev-fault', (l.failed_logins || 0) > 0 && (l.successful_logins || 0) === 0);
        // Header pills (optional — only present in the legacy header layout)
        const pvPill = document.querySelector('#pill-pageviews span');
        if (pvPill) pvPill.textContent = num(s.page_views);
        const uvPill = document.querySelector('#pill-visitors span');
        if (uvPill) uvPill.textContent = num(s.unique_visitors);
    }

    // ----- Visitor world map (Leaflet, flag/dot markers sized by traffic) -----
    let trafficMap = null;
    let trafficMapLayer = null;
    // Blue = countries, amber = US states. A small legend explains the two.
    const GEO_COUNTRY_COLOR = '#58a6ff';
    const GEO_STATE_COLOR = '#f0883e';

    function _radiusFor(count, maxCount) {
        // Radius scales with sqrt(share) so area ∝ count; clamp to sane bounds.
        return 6 + 22 * Math.sqrt((count || 0) / (maxCount || 1));
    }

    function _ensureMapLegend() {
        if (trafficMap._geoLegend) return;
        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'traffic-map-legend');
            div.innerHTML =
                `<span><i style="background:${GEO_COUNTRY_COLOR}"></i> Country</span>` +
                `<span><i style="background:${GEO_STATE_COLOR}"></i> US state</span>`;
            return div;
        };
        legend.addTo(trafficMap);
        trafficMap._geoLegend = legend;
    }

    function renderTrafficMap(countryRows, regionRows) {
        countryRows = countryRows || [];
        regionRows = regionRows || [];
        const centroids = window.COUNTRY_CENTROIDS || {};
        const stateCentroids = window.US_STATE_CENTROIDS || {};
        if (typeof L === 'undefined') return;
        if (!trafficMap) {
            // Themed basemap; no vignette or scale bar — this is a marker
            // cloud over a world view, where edge darkening only hides dots.
            trafficMap = EASMap.create('trafficMap', {
                worldCopyJump: true, minZoom: 1, attributionControl: true,
                vignette: false, scale: false, tile: { maxZoom: 8 }
            }).setView([20, 0], 2);
        }
        _ensureMapLegend();
        if (trafficMapLayer) { trafficMap.removeLayer(trafficMapLayer); trafficMapLayer = null; }

        const markers = [];

        // ----- Country markers (blue) -----
        const locatedCountries = countryRows.filter(r => r.country_code && centroids[r.country_code.toUpperCase()]);
        const maxCountry = locatedCountries.length ? Math.max(...locatedCountries.map(r => r.count)) : 0;
        locatedCountries.forEach(r => {
            const cc = r.country_code.toUpperCase();
            const m = L.circleMarker(centroids[cc], {
                radius: _radiusFor(r.count, maxCountry), className: 'traffic-geo-dot',
                color: GEO_COUNTRY_COLOR, weight: 2, fillColor: GEO_COUNTRY_COLOR, fillOpacity: 0.40
            });
            const flag = flagImg(cc, r.country);
            m.bindPopup(`<div class="traffic-geo-popup">${flag} <strong>${escapeHtml(r.country || cc)}</strong><br>${num(r.count)} hits</div>`);
            markers.push(m);
        });

        // ----- US state markers (amber), drawn on top of the country dots -----
        const locatedStates = regionRows.filter(r =>
            (r.country_code || '').toUpperCase() === 'US' &&
            r.region_code && stateCentroids[r.region_code.toUpperCase()]
        );
        const maxState = locatedStates.length ? Math.max(...locatedStates.map(r => r.count)) : 0;
        locatedStates.forEach(r => {
            const sc = r.region_code.toUpperCase();
            const m = L.circleMarker(stateCentroids[sc], {
                radius: _radiusFor(r.count, maxState), className: 'traffic-geo-dot',
                color: GEO_STATE_COLOR, weight: 2, fillColor: GEO_STATE_COLOR, fillOpacity: 0.55
            });
            m.bindPopup(`<div class="traffic-geo-popup">🇺🇸 <strong>${escapeHtml(r.region || sc)}</strong> (${escapeHtml(sc)})<br>${num(r.count)} hits</div>`);
            markers.push(m);
        });

        if (!markers.length) {
            // Nothing to plot (likely local-only traffic / no GeoIP DB).
            trafficMap.setView([20, 0], 2);
            setTimeout(() => trafficMap.invalidateSize(), 50);
            return;
        }
        trafficMapLayer = L.layerGroup(markers).addTo(trafficMap);
        // Leaflet needs a size recalc when the container was hidden/resized.
        setTimeout(() => trafficMap.invalidateSize(), 50);
    }

    function renderTable(id, rows, rowHtml, cols) {
        const tb = document.getElementById(id);
        if (!rows || !rows.length) { tb.innerHTML = `<tr><td colspan="${cols}" class="text-center text-muted">No data</td></tr>`; return; }
        tb.innerHTML = '';
        rows.forEach(r => tb.insertAdjacentHTML('beforeend', `<tr>${rowHtml(r)}</tr>`));
    }

    async function loadSettings() {
        try {
            const resp = await fetch('/api/traffic/settings');
            const data = await resp.json();
            if (data.success) {
                const s = data.settings;
                document.getElementById('setEnabled').checked = s.enabled;
                document.getElementById('setLogApi').checked = s.log_api_requests;
                document.getElementById('setAuthOnly').checked = s.log_authenticated_only;
                document.getElementById('setExcludeBots').checked = s.exclude_bots;
                document.getElementById('setResolveHostnames').checked = s.resolve_hostnames;
                document.getElementById('setExcludeLoopback').checked = s.exclude_loopback;
                document.getElementById('setExcludedPaths').value = s.excluded_paths || '';
                document.getElementById('setRetention').value = s.retention_days;
                document.getElementById('setGeoip').value = s.geoip_database_path || '';
                document.getElementById('setGeoipAsn').value = s.geoip_asn_database_path || '';
                document.getElementById('setAnonymizeIp').checked = s.anonymize_ip;
                document.getElementById('setAnomalyEnabled').checked = s.anomaly_detection_enabled;
                document.getElementById('setAnomalyErrorRate').value = s.anomaly_error_rate_pct;
                document.getElementById('setAnomaly5xx').value = s.anomaly_5xx_threshold;
                document.getElementById('setAnomalyLogin').value = s.anomaly_failed_login_threshold;
                document.getElementById('setAnomalyScanner').value = s.anomaly_scanner_threshold;
                renderGeoipStatus(data.geoip_status);
            }
        } catch (err) { console.error('Error loading settings:', err); }
    }

    function renderGeoipStatus(st) {
        const box = document.getElementById('geoipStatus');
        if (!box) return;
        if (!st) { box.className = 'alert alert-secondary py-2 px-3 mb-2'; box.textContent = ''; return; }
        let cls, icon;
        if (st.resolves) { cls = 'alert-success'; icon = 'fa-check-circle'; }
        else if (!st.reader_installed) { cls = 'alert-danger'; icon = 'fa-triangle-exclamation'; }
        else { cls = 'alert-warning'; icon = 'fa-circle-info'; }
        box.className = `alert ${cls} py-2 px-3 mb-2`;
        const sample = st.sample ? ` <span class="text-muted">(${escapeHtml(st.sample)})</span>` : '';
        let html = `<div class="d-flex align-items-center gap-2"><i class="fas ${icon}"></i><span><strong>GeoIP:</strong> ${escapeHtml(st.message || '')}${sample}</span></div>`;
        if (st.asn_configured) {
            const asnOk = st.asn_resolves;
            const asnSample = st.asn_sample ? ` <span class="text-muted">(${escapeHtml(st.asn_sample)})</span>` : '';
            html += `<div class="d-flex align-items-center gap-2 mt-1"><i class="fas ${asnOk ? 'fa-check-circle' : 'fa-circle-info'}"></i><span><strong>ASN:</strong> ${asnOk ? 'Active — IPs resolve to network operators.' : 'Configured but not resolving.'}${asnSample}</span></div>`;
        }
        box.innerHTML = html;
    }

    async function uploadGeoip() {
        const input = document.getElementById('setGeoipUpload');
        const statusEl = document.getElementById('geoipUploadStatus');
        const btn = document.getElementById('geoipUploadBtn');
        if (!input.files || !input.files.length) {
            statusEl.innerHTML = '<span class="text-warning">Choose a .mmdb file first.</span>';
            return;
        }
        const fd = new FormData();
        fd.append('file', input.files[0]);
        btn.disabled = true;
        statusEl.innerHTML = '<span class="text-muted">Uploading & validating…</span>';
        try {
            const resp = await fetch('/api/traffic/geoip/upload', { method: 'POST', body: fd });
            const data = await resp.json();
            if (data.success) {
                const kind = data.kind ? ` (${escapeHtml(data.kind)})` : '';
                if (data.note) {
                    statusEl.innerHTML = `<span class="text-warning">${escapeHtml(data.note)}</span>`;
                } else {
                    statusEl.innerHTML = `<span class="text-success">Database installed${kind}. Resolution is now active.</span>`;
                }
                if (typeof showToast === 'function') showToast('GeoIP database installed' + kind, 'success');
                loadSettings();  // refresh the GeoIP status badge + path fields
            } else {
                statusEl.innerHTML = `<span class="text-danger">${escapeHtml(data.error || 'Upload failed')}</span>`;
            }
        } catch (err) {
            console.error('GeoIP upload failed:', err);
            statusEl.innerHTML = '<span class="text-danger">Upload failed.</span>';
        } finally {
            btn.disabled = false;
        }
    }

    async function saveSettings() {
        const payload = {
            enabled: document.getElementById('setEnabled').checked,
            log_api_requests: document.getElementById('setLogApi').checked,
            log_authenticated_only: document.getElementById('setAuthOnly').checked,
            exclude_bots: document.getElementById('setExcludeBots').checked,
            resolve_hostnames: document.getElementById('setResolveHostnames').checked,
            exclude_loopback: document.getElementById('setExcludeLoopback').checked,
            excluded_paths: document.getElementById('setExcludedPaths').value,
            retention_days: parseInt(document.getElementById('setRetention').value, 10) || 90,
            geoip_database_path: document.getElementById('setGeoip').value,
            geoip_asn_database_path: document.getElementById('setGeoipAsn').value,
            anonymize_ip: document.getElementById('setAnonymizeIp').checked,
            anomaly_detection_enabled: document.getElementById('setAnomalyEnabled').checked,
            anomaly_error_rate_pct: parseInt(document.getElementById('setAnomalyErrorRate').value, 10) || 25,
            anomaly_5xx_threshold: parseInt(document.getElementById('setAnomaly5xx').value, 10) || 25,
            anomaly_failed_login_threshold: parseInt(document.getElementById('setAnomalyLogin').value, 10) || 10,
            anomaly_scanner_threshold: parseInt(document.getElementById('setAnomalyScanner').value, 10) || 50
        };
        try {
            const resp = await fetch('/api/traffic/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await resp.json();
            if (data.success) {
                showToast('Traffic settings saved', 'success');
                const modalEl = document.getElementById('trafficSettingsModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
            } else {
                showToast('Failed to save settings: ' + (data.error || 'unknown'), 'danger');
            }
        } catch (err) {
            console.error('Error saving settings:', err);
            showToast('Error saving settings', 'danger');
        }
    }

    // Purge or anonymize all recorded requests for a specific visitor IP (GDPR).
    async function privacyAction(action) {
        const ip = (document.getElementById('privacyIp').value || '').trim();
        const statusEl = document.getElementById('privacyStatus');
        if (!ip) { statusEl.innerHTML = '<span class="text-warning">Enter an IP address first.</span>'; return; }
        const verb = action === 'purge' ? 'permanently delete' : 'anonymize';
        if (!window.confirm(`This will ${verb} all recorded requests for ${ip}. Continue?`)) return;
        statusEl.innerHTML = '<span class="text-muted">Working…</span>';
        try {
            const resp = await fetch(`/api/traffic/privacy/${action}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ip })
            });
            const data = await resp.json();
            if (data.success) {
                const msg = action === 'purge'
                    ? `Purged ${num(data.deleted)} row(s) for ${escapeHtml(ip)}.`
                    : `Anonymized ${num(data.updated)} row(s) for ${escapeHtml(ip)} → ${escapeHtml(data.masked)}.`;
                statusEl.innerHTML = `<span class="text-success">${msg}</span>`;
                if (typeof showToast === 'function') showToast('Privacy action applied', 'success');
                loadDashboard();  // reflect the change in the dashboard
            } else {
                statusEl.innerHTML = `<span class="text-danger">${escapeHtml(data.error || 'Failed')}</span>`;
            }
        } catch (err) {
            console.error('Privacy action failed:', err);
            statusEl.innerHTML = '<span class="text-danger">Request failed.</span>';
        }
    }

    // Permanently delete EVERY recorded request (full analytics reset).
    async function purgeAllTraffic() {
        const statusEl = document.getElementById('purgeAllStatus');
        const btn = document.getElementById('purgeAllBtn');
        if (!window.confirm('Permanently delete ALL recorded traffic data?\n\nEvery report resets to zero. Your settings and GeoIP databases are kept. This cannot be undone.')) return;
        if (btn) btn.disabled = true;
        statusEl.innerHTML = '<span class="text-muted">Purging…</span>';
        try {
            const resp = await fetch('/api/traffic/purge-all', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }
            });
            const data = await resp.json();
            if (data.success) {
                statusEl.innerHTML = `<span class="text-success">Deleted ${num(data.deleted)} row(s). All reports reset.</span>`;
                if (typeof showToast === 'function') showToast('All traffic data purged', 'success');
                loadDashboard();  // reflect the empty dataset
            } else {
                statusEl.innerHTML = `<span class="text-danger">${escapeHtml(data.error || 'Failed')}</span>`;
            }
        } catch (err) {
            console.error('Purge-all failed:', err);
            statusEl.innerHTML = '<span class="text-danger">Request failed.</span>';
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    // ------------------------------------------------------------------ export
    function rangeText() {
        // Prefer the actual window the data was built for (handles custom ranges).
        if (lastDashboardData && lastDashboardData.filter_meta) {
            const m = lastDashboardData.filter_meta;
            let txt = m.window_label;
            if (m.dimensions && m.dimensions.length) {
                txt += ' — ' + m.dimensions.map(d => `${d.label}:${d.value}`).join(', ');
            }
            return txt;
        }
        const sel = document.getElementById('rangeSelect');
        return sel.options[sel.selectedIndex].text;
    }

    // Build a multi-section CSV (opens cleanly in Excel) from the loaded data.
    function exportTrafficCsv() {
        if (!lastDashboardData) { if (window.showToast) showToast('No data to export yet', 'warning'); return; }
        const d = lastDashboardData;
        const esc = v => `"${String(v === null || v === undefined ? '' : v).replace(/"/g, '""')}"`;
        const lines = [];
        const section = (title, headers, rows) => {
            lines.push(esc(title));
            lines.push(headers.map(esc).join(','));
            (rows || []).forEach(r => lines.push(r.map(esc).join(',')));
            lines.push('');
        };
        lines.push(esc(`EAS Station Traffic Analytics — ${rangeText()} — generated ${new Date().toLocaleString()}`));
        lines.push('');
        const s = d.summary, l = d.login_summary;
        section('Summary', ['Metric', 'Value'], [
            ['Page views', s.page_views], ['Unique visitors', s.unique_visitors],
            ['Total hits', s.total_hits], ['API hits', s.api_hits], ['Bot hits', s.bot_hits],
            ['Errors (4xx/5xx)', s.error_hits], ['Hits last 24h', s.hits_last_24h],
            ['Avg response ms', s.avg_response_ms], ['Total bytes', s.total_bytes],
            ['Avg bytes/req', s.avg_bytes], ['Successful logins', l.successful_logins],
            ['Failed logins', l.failed_logins], ['Active sessions', l.active_sessions],
        ]);
        section('Top Pages', ['Path', 'Hits', 'Avg ms'], (d.top_pages || []).map(r => [r.path, r.hits, r.avg_response_ms]));
        section('Slowest Endpoints', ['Path', 'Avg ms', 'Max ms', 'Hits'], (d.slowest_pages || []).map(r => [r.path, r.avg_response_ms, r.max_response_ms, r.hits]));
        section('Device Types', ['Device', 'Hits'], (d.device_breakdown || []).map(r => [r.device, r.count]));
        section('HTTP Methods', ['Method', 'Hits'], (d.method_breakdown || []).map(r => [r.method, r.count]));
        section('Authenticated vs Anonymous', ['Type', 'Hits'], (d.auth_breakdown || []).map(r => [r.label, r.count]));
        section('Search Engines', ['Engine', 'Hits'], (d.search_engine_breakdown || []).map(r => [r.engine, r.count]));
        section('Top Visitors', ['IP', 'Hostname', 'Country', 'User', 'Hits', 'Last seen'],
            (d.top_visitors || []).map(r => [r.ip_address, r.hostname, r.country, r.username, r.hits, r.last_seen]));
        section('Operating Systems', ['OS', 'Hits'], (d.os_breakdown || []).map(r => [r.os, r.count]));
        section('Browsers', ['Browser', 'Hits'], (d.browser_breakdown || []).map(r => [r.browser, r.count]));
        section('Countries / Networks', ['Country', 'Code', 'Hits'], (d.country_breakdown || []).map(r => [r.country, r.country_code, r.count]));
        section('Organizations / ISPs', ['Network Operator', 'Hits'], (d.asn_breakdown || []).map(r => [r.asn_org, r.count]));
        section('Cities', ['City', 'Region', 'Hits'], (d.city_breakdown || []).map(r => [r.city, r.region_code || r.region || '', r.count]));
        section('IP Versions', ['Family', 'Hits', 'Visitors', 'Addresses', 'rDNS resolved'], (d.ip_version_breakdown || []).map(r => [r.label, r.count, r.visitors, r.ips, r.resolved]));
        section('Languages', ['Language', 'Hits'], (d.language_breakdown || []).map(r => [r.language, r.count]));
        section('Screen Resolutions', ['Resolution', 'Hits'], (d.resolution_breakdown || []).map(r => [r.resolution, r.count]));
        section('Referrers', ['Referrer', 'Hits'], (d.referer_breakdown || []).map(r => [r.referer, r.count]));
        if (d.visits) {
            section('Visits', ['Metric', 'Value'], [['Visits', d.visits.visits], ['Avg duration (s)', d.visits.avg_duration_seconds]]);
            section('Entry Pages', ['Path', 'Visits'], (d.visits.entry_pages || []).map(r => [r.path, r.count]));
            section('Exit Pages', ['Path', 'Visits'], (d.visits.exit_pages || []).map(r => [r.path, r.count]));
        }
        section('File Types', ['Type', 'Hits'], (d.filetype_breakdown || []).map(r => [r.filetype, r.count]));
        section('Search Keyphrases', ['Keyphrase', 'Hits'], (d.search_terms || []).map(r => [r.term, r.count]));
        section('Robots / Spiders', ['Bot', 'Hits'], (d.bot_breakdown || []).map(r => [r.bot, r.hits]));
        section('Top Error URLs', ['Path', 'Status', 'Hits'], (d.error_pages || []).map(r => [r.path, r.status_code, r.hits]));
        section('Top Error Sources', ['IP', 'Hostname', 'Errors', 'Top Error Path', 'Top Status'], (d.error_sources || []).map(r => [r.ip_address, r.hostname, r.errors, r.top_path, r.top_status]));
        section('Hits by Hour', ['Hour', 'Hits'], (d.hourly_distribution.labels || []).map((h, i) => [h, d.hourly_distribution.hits[i]]));
        section('Hits by Weekday', ['Day', 'Hits'], (d.weekday_distribution.labels || []).map((w, i) => [w, d.weekday_distribution.hits[i]]));
        section('Top Login IPs', ['IP', 'Success', 'Failed'], (d.top_login_ips || []).map(r => [r.ip_address, r.success, r.failure]));

        const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `traffic_analytics_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        if (window.showToast) showToast('CSV exported', 'success');
    }

    // Render the whole dashboard to a multi-page A4 PDF (charts + tables).
    async function exportTrafficPdf() {
        if (typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF || typeof html2canvas === 'undefined') {
            if (window.showToast) showToast('PDF libraries failed to load', 'danger');
            return;
        }
        if (window.showToast) showToast('Building PDF…', 'info');
        const { jsPDF } = window.jspdf;
        const target = document.querySelector('.traffic-dash-root');
        try {
            // The Leaflet visitor map paints cross-origin OpenStreetMap tiles,
            // which taint the html2canvas canvas and make toDataURL() throw a
            // SecurityError — the original "PDF export failed". Skip the map (and
            // any Leaflet tiles) during capture; everything else is same-origin.
            const skipFromPdf = (el) => {
                if (!el) return false;
                if (el.id === 'trafficMap') return true;
                const cl = el.classList;
                return !!(cl && (cl.contains('leaflet-container') || cl.contains('leaflet-tile-pane')));
            };
            const canvas = await html2canvas(target, {
                scale: 2,
                backgroundColor: getComputedStyle(document.body).backgroundColor || '#ffffff',
                useCORS: true,
                ignoreElements: skipFromPdf,
            });
            const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
            const pageW = doc.internal.pageSize.getWidth();
            const pageH = doc.internal.pageSize.getHeight();
            const imgW = pageW;
            const imgH = canvas.height * imgW / canvas.width;
            let heightLeft = imgH;
            let position = 0;
            const imgData = canvas.toDataURL('image/png');
            doc.addImage(imgData, 'PNG', 0, position, imgW, imgH);
            heightLeft -= pageH;
            while (heightLeft > 0) {
                position -= pageH;
                doc.addPage();
                doc.addImage(imgData, 'PNG', 0, position, imgW, imgH);
                heightLeft -= pageH;
            }
            doc.save(`traffic_analytics_${new Date().toISOString().split('T')[0]}.pdf`);
            if (window.showToast) showToast('PDF exported', 'success');
        } catch (err) {
            console.error('PDF export failed:', err);
            const detail = err && err.message ? `: ${err.message}` : '';
            if (window.showToast) showToast(`PDF export failed${detail}`, 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        const sel = document.getElementById('rangeSelect');
        sel.addEventListener('change', function () {
            const custom = document.getElementById('customRangeControls');
            if (sel.value === 'custom') {
                custom.classList.remove('d-none');
                custom.style.display = 'inline-flex';
                // Pre-fill sensible defaults (last 30 days) on first switch.
                const end = document.getElementById('rangeEnd');
                const start = document.getElementById('rangeStart');
                if (!end.value) end.value = new Date().toISOString().slice(0, 10);
                if (!start.value) start.value = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
                return;  // wait for Apply
            }
            custom.classList.add('d-none');
            custom.style.display = 'none';
            loadDashboard();
        });
        document.getElementById('trafficSettingsModal').addEventListener('show.bs.modal', loadSettings);

        // Per-table search inputs (filter live; survive auto-refresh re-renders).
        Object.entries(TABLE_SEARCHES).forEach(([inputId, tbodyId]) => {
            const el = document.getElementById(inputId);
            if (el) el.addEventListener('input', () => applyTableSearch(inputId, tbodyId));
        });

        // Delegated drill-down: any element with data-fk/data-fv applies a filter.
        document.querySelector('.traffic-dash-root').addEventListener('click', function (ev) {
            const el = ev.target.closest('[data-fk]');
            if (!el) return;
            ev.preventDefault();
            addFilter(el.getAttribute('data-fk'), el.getAttribute('data-fv'));
        });

        // Auto-refresh, but only when someone is actually looking.
        //
        // One dashboard refresh runs ~35 aggregations over web_request_log. The
        // old unconditional 60-second interval kept paying that on a backgrounded
        // browser tab, on a laptop left open overnight, and while the operator
        // was reading a different Security Center tab entirely — the single
        // largest recurring CPU cost the web process carried. Skipping a hidden
        // refresh costs nothing: the next visible tick reloads the data, and
        // becoming visible triggers an immediate reload if the data went stale.
        //
        // 120s (was 60s): even while the pane genuinely is visible, traffic
        // analytics don't need sub-2-minute freshness, and this station's CPU
        // budget is tight enough that halving the query volume for an actively
        // open dashboard is worth the extra minute of staleness. Keep this in
        // sync with _DASHBOARD_CACHE_TTL_SECONDS in traffic_stats.py -- that
        // TTL is deliberately set just under this interval.
        const REFRESH_MS = 120000;
        let lastLoadedAt = 0;

        function trafficPaneVisible() {
            if (document.visibilityState === 'hidden') return false;
            const pane = document.getElementById('traffic-pane');
            // Standalone use (no tabs) counts as visible.
            return !pane || pane.classList.contains('active');
        }

        function refreshIfVisible() {
            if (!trafficPaneVisible()) return;
            lastLoadedAt = Date.now();
            loadDashboard();
        }

        function refreshIfStale() {
            if (trafficPaneVisible() && Date.now() - lastLoadedAt >= REFRESH_MS) {
                refreshIfVisible();
            }
        }

        refreshIfVisible();
        setInterval(refreshIfVisible, REFRESH_MS);

        // Catch up as soon as the operator comes back to the data.
        document.addEventListener('visibilitychange', refreshIfStale);
        const trafficTabBtn = document.getElementById('traffic-tab');
        if (trafficTabBtn) {
            trafficTabBtn.addEventListener('shown.bs.tab', refreshIfStale);
        }
    });
</script>
