<!-- Navbar-scoped styles. Split out of navbar.html to keep that template within
     the size guidance in AGENTS.md; included at the end of the navbar markup. -->
<style>
/* ── Stack-light tower — visual twin of the ANDONT 7-color USB stack ──
   light: a SINGLE translucent lamp capped by a black dome and seated on
   a weighted base, glowing one colour at a time
   (off / green / blue / red / cyan / yellow / magenta / white). */
.sl-tower {
    --sl-lamp-w: 19px;
    --sl-lamp-h: 30px;
    --sl-color: transparent;        /* lit colour, set per state below     */
    --sl-glow:  rgba(0,0,0,0);       /* halo colour, set per state below     */
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin-left: 0.6rem;
    padding-left: 0.6rem;
    user-select: none;
    flex-shrink: 0;
    cursor: default;
    border-left: 1px solid rgba(255, 255, 255, 0.16);
    outline: none;
}
.sl-tower:focus-visible {
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45);
    border-radius: 6px;
}

/* Domed black cap */
.sl-cap {
    width: calc(var(--sl-lamp-w) + 2px);
    height: 7px;
    border-radius: 8px 8px 3px 3px / 10px 10px 3px 3px;
    background: linear-gradient(155deg, #3a3a40 0%, #1d1d22 55%, #101013 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 1px 2px rgba(0,0,0,0.5);
    z-index: 2;
}

/* Single cylindrical lamp — dark tinted glass when off */
.sl-lamp {
    width: var(--sl-lamp-w);
    height: var(--sl-lamp-h);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.5);
    background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.15)),
        var(--sl-color, rgba(20,20,24,0.85));
    box-shadow:
        0 0 8px 1px var(--sl-glow),
        0 0 18px 5px var(--sl-glow),
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -4px 8px rgba(0,0,0,0.35);
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

/* Inner radial glow that intensifies when lit */
.sl-lamp-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 38%,
        rgba(255,255,255,0.55) 0%, transparent 55%);
    opacity: 0.25;
    pointer-events: none;
}
.sl-tower:not(.sl-c-off) .sl-lamp-glow { opacity: 0.6; }

/* Vertical specular sheen down the lamp */
.sl-lamp::before {
    content: '';
    position: absolute;
    top: 2px; left: 22%;
    width: 18%; height: calc(100% - 4px);
    border-radius: 3px;
    background: linear-gradient(90deg,
        transparent, rgba(255,255,255,0.6), transparent);
    opacity: 0.4;
    pointer-events: none;
}

/* Weighted base / foot */
.sl-foot {
    width: calc(var(--sl-lamp-w) + 4px);
    height: 6px;
    border-radius: 2px 2px 4px 4px;
    background: linear-gradient(180deg, #2c2c32 0%, #161619 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 4px rgba(0,0,0,0.45);
}

/* ── ANDONT colour palette — one colour at a time ─────────────────── */
.sl-c-off    { --sl-color: rgba(22,22,26,0.85);                        --sl-glow: rgba(0,0,0,0); }
.sl-c-green  { --sl-color: linear-gradient(180deg,#7bffa0,#1fbf3e 60%,#0d9a2c);   --sl-glow: rgba(34,210,68,0.55); }
.sl-c-blue   { --sl-color: linear-gradient(180deg,#8ec5ff,#2f86ff 60%,#0a57cc);   --sl-glow: rgba(48,134,255,0.55); }
.sl-c-red    { --sl-color: linear-gradient(180deg,#ff7b7b,#ff2424 60%,#c40000);   --sl-glow: rgba(255,45,45,0.6); }
.sl-c-cyan   { --sl-color: linear-gradient(180deg,#9ffcff,#22e0e8 60%,#0c9aa3);   --sl-glow: rgba(40,220,232,0.55); }
.sl-c-yellow { --sl-color: linear-gradient(180deg,#ffe98a,#ffce1f 60%,#caa000);   --sl-glow: rgba(255,206,31,0.55); }
.sl-c-magenta{ --sl-color: linear-gradient(180deg,#ff9bf2,#ff35d6 60%,#c00fa0);   --sl-glow: rgba(255,53,214,0.6); }
.sl-c-white  { --sl-color: linear-gradient(180deg,#ffffff,#eef2ff 60%,#c7cfe6);   --sl-glow: rgba(235,240,255,0.6); }

/* Flashing lamp (fault / alert / incoming / test) */
@keyframes sl-flash {
    0%, 49%   { filter: brightness(1.12); }
    50%, 100% { filter: brightness(0.4) saturate(0.6); }
}
.sl-tower.sl-flash .sl-lamp { animation: sl-flash 0.6s step-end infinite; }

/* Buzzer cue — small speaker badge that pulses when the buzzer would sound */
.sl-buzzer {
    position: absolute;
    top: -4px;
    right: -9px;
    display: none;
    align-items: center;
    justify-content: center;
    width: 13px;
    height: 13px;
    font-size: 8px;
    line-height: 1;
    color: #fff;
    background: #ff2d2d;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255, 45, 45, 0.85);
}
.sl-tower.sl-buzzer-on .sl-buzzer {
    display: inline-flex;
    animation: sl-buzz 0.5s ease-in-out infinite;
}
@keyframes sl-buzz {
    0%, 100% { transform: scale(1);    opacity: 1; }
    50%      { transform: scale(1.25); opacity: 0.55; }
}

@media (prefers-reduced-motion: reduce) {
    .sl-tower.sl-flash .sl-lamp,
    .sl-tower.sl-buzzer-on .sl-buzzer { animation: none; }
}

/* ── Breathing "aurora" sheen (#1) ───────────────────────────────────────
   A slow-drifting translucent radial gradient behind the navbar content.

/* Note: the navbar is position:sticky (a positioned element), so the aurora

.navbar-aurora {
    position: absolute;
    inset: 0;

[data-theme="blue"] .navbar-clock,

/* ── "On Air" navbar state (#5) ──────────────────────────────────────────
   Mirrors the stack-light red state: a pulsing red top edge + soft glow so

    box-shadow:

/* ── Logo shimmer on load (#6) ───────────────────────────────────────────
   One-time diagonal light sweep across the brand wordmark on first paint. */
.navbar-brand::after {

    position: absolute;
    top: 0;
    left: -60%;

    height: 100%;
    background: linear-gradient(115deg,
        transparent,
        rgba(255, 255, 255, 0.55),
        transparent);
    transform: skewX(-18deg);
    pointer-events: none;
    opacity: 0;
    animation: brandShimmer 1.5s var(--ease-ios, ease) 0.45s 1;
}
@keyframes brandShimmer {
    0%   { left: -60%; opacity: 0; }
    12%  { opacity: 1; }
    100% { left: 130%; opacity: 0; }
}
.navbar-brand:hover::after {
    animation: brandShimmer 1.1s var(--ease-ios, ease) 1;
}

/* Respect users who prefer reduced motion — drop the ambient animations */
@media (prefers-reduced-motion: reduce) {
    .navbar-aurora,
    .navbar.navbar-on-air,
    .navbar-brand::after { animation: none; }
