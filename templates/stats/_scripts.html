// ============================================

// Helper function to get CSS variables
function getCSSVar(varName, fallback = '#212529') {
    const value = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    return value || fallback;
}

const GRADIENT_PALETTES = {
    primary: [getCSSVar('--chart-primary-start', '#667eea'), getCSSVar('--chart-primary-end', '#764ba2')],
    success: [getCSSVar('--chart-success-start', '#11998e'), getCSSVar('--chart-success-end', '#38ef7d')],
    danger: [getCSSVar('--chart-danger-start', '#eb3349'), getCSSVar('--chart-danger-end', '#f45c43')],
    warning: [getCSSVar('--chart-warning-start', '#f093fb'), getCSSVar('--chart-warning-end', '#f5576c')],
    info: [getCSSVar('--chart-info-start', '#4facfe'), getCSSVar('--chart-info-end', '#00f2fe')],
    purple: [getCSSVar('--chart-purple-start', '#a855f7'), getCSSVar('--chart-purple-end', '#6366f1')],
    teal: [getCSSVar('--chart-teal-start', '#0891b2'), getCSSVar('--chart-teal-end', '#06b6d4')],
    orange: [getCSSVar('--chart-orange-start', '#f97316'), getCSSVar('--chart-orange-end', '#fb923c')],
    pink: [getCSSVar('--chart-pink-start', '#ec4899'), getCSSVar('--chart-pink-end', '#f472b6')],
    indigo: [getCSSVar('--chart-indigo-start', '#6366f1'), getCSSVar('--chart-indigo-end', '#818cf8')]
};

const CHART_GRADIENTS = [
    GRADIENT_PALETTES.primary,
    GRADIENT_PALETTES.success,
    GRADIENT_PALETTES.warning,
    GRADIENT_PALETTES.danger,
    GRADIENT_PALETTES.info,
    GRADIENT_PALETTES.purple,
    GRADIENT_PALETTES.teal,
    GRADIENT_PALETTES.orange,
    GRADIENT_PALETTES.pink,
    GRADIENT_PALETTES.indigo
];

function createGradient(ctx, colorStops, vertical = true) {
    const gradient = vertical
        ? ctx.createLinearGradient(0, 0, 0, ctx.canvas.height)
        : ctx.createLinearGradient(0, 0, ctx.canvas.width, 0);
    gradient.addColorStop(0, colorStops[0]);
    gradient.addColorStop(1, colorStops[1]);
    return gradient;
}

function createRadialGradient(ctx, colorStops) {
    const centerX = ctx.canvas.width / 2;
    const centerY = ctx.canvas.height / 2;
    const radius = Math.min(centerX, centerY);
    const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
    gradient.addColorStop(0, colorStops[0]);
    gradient.addColorStop(1, colorStops[1]);
    return gradient;
}

// Helper function to convert hex color to RGB object
function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
    } : { r: 102, g: 126, b: 234 }; // fallback to primary color (#667eea converted to RGB)
}

// Heatmap color interpolation
function getHeatmapColor(value, max) {
    const primaryStart = getCSSVar('--chart-primary-start', '#667eea');
    if (max === 0) {
        // Return primary color with low opacity
        const rgb = hexToRgb(primaryStart);
        return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.05)`;
    }
    const ratio = Math.min(value / max, 1);

    // Beautiful gradient from primary to danger colors
    const primaryStartRgb = hexToRgb(getCSSVar('--chart-primary-start', '#667eea'));
    const infoStartRgb = hexToRgb(getCSSVar('--chart-info-start', '#36d1dc'));
    const warningStartRgb = hexToRgb(getCSSVar('--chart-warning-start', '#f7971e'));
    const dangerStartRgb = hexToRgb(getCSSVar('--chart-danger-start', '#eb3349'));
    const dangerEndRgb = hexToRgb(getCSSVar('--chart-danger-end', '#f45c43'));
    
    const colors = [
        { pos: 0, r: primaryStartRgb.r, g: primaryStartRgb.g, b: primaryStartRgb.b, a: 0.1 },
        { pos: 0.25, r: infoStartRgb.r, g: infoStartRgb.g, b: infoStartRgb.b, a: 0.3 },
        { pos: 0.5, r: warningStartRgb.r, g: warningStartRgb.g, b: warningStartRgb.b, a: 0.5 },
        { pos: 0.75, r: dangerStartRgb.r, g: dangerStartRgb.g, b: dangerStartRgb.b, a: 0.75 },
        { pos: 1, r: dangerEndRgb.r, g: dangerEndRgb.g, b: dangerEndRgb.b, a: 0.95 }
    ];

    let lower = colors[0], upper = colors[colors.length - 1];
    for (let i = 0; i < colors.length - 1; i++) {
        if (ratio >= colors[i].pos && ratio <= colors[i + 1].pos) {
            lower = colors[i];
            upper = colors[i + 1];
            break;
        }
    }

    const range = upper.pos - lower.pos || 1;
    const t = (ratio - lower.pos) / range;

    const r = Math.round(lower.r + (upper.r - lower.r) * t);
    const g = Math.round(lower.g + (upper.g - lower.g) * t);
    const b = Math.round(lower.b + (upper.b - lower.b) * t);
    const a = lower.a + (upper.a - lower.a) * t;

    return `rgba(${r}, ${g}, ${b}, ${a})`;
}

// ============================================
// THEME MANAGEMENT

function getChartThemeColors() {
    const isDark = document.documentElement.getAttribute('data-theme-mode') === 'dark';
    const gridColor = getCSSVar('--chart-grid', isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.06)');
    const textColor = getCSSVar('--chart-text', isDark ? 'rgba(255, 255, 255, 0.7)' : 'rgba(0, 0, 0, 0.7)');
    
    return {
        text: getCSSVar('--text-color', isDark ? '#ffffff' : '#212529'),
        textMuted: getCSSVar('--text-muted', isDark ? '#a8b4cc' : '#8892a6'),
        surface: getCSSVar('--surface-color', isDark ? '#243046' : '#ffffff'),
        border: getCSSVar('--border-color', isDark ? '#40516c' : '#ced7ea'),
        gridLines: gridColor,
        chartText: textColor
    };
}

function applyChartTheme() {
    const colors = getChartThemeColors();
    Chart.defaults.font.family = "'Inter', 'Segoe UI', sans-serif";
    Chart.defaults.color = colors.text;
    Chart.defaults.borderColor = colors.border;
    Chart.defaults.plugins.legend.labels.color = colors.text;
    Chart.defaults.plugins.tooltip.backgroundColor = colors.surface;
    Chart.defaults.plugins.tooltip.titleColor = colors.text;
    Chart.defaults.plugins.tooltip.bodyColor = colors.text;
    Chart.defaults.plugins.tooltip.borderColor = colors.border;
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.plugins.tooltip.padding = 12;
    Chart.defaults.responsive = true;
    Chart.defaults.maintainAspectRatio = false;
    Chart.defaults.plugins.datalabels.display = false;
}

applyChartTheme();

// ============================================
// STATE MANAGEMENT
// ============================================

const state = {
    charts: {},
    filters: {
        preset: 'last30',
        startDate: null,
        endDate: null,
        severities: new Set(),
        statuses: new Set(),
        events: new Set()

// ============================================
// FILTER MANAGEMENT
// ============================================

function populateFilterSelect(id, options) {
    const select = document.getElementById(id);
    if (!select) return;
    select.innerHTML = options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
}

function setPresetDates(preset) {
    const end = new Date();
    end.setHours(23, 59, 59, 999);
    const start = new Date(end);

    const days = { last7: 6, last30: 29, last90: 89, last180: 179, last365: 364 };
    if (days[preset] !== undefined) {
        start.setDate(end.getDate() - days[preset]);
    }
    start.setHours(0, 0, 0, 0);

    state.filters.preset = preset;
    state.filters.startDate = start;
    state.filters.endDate = end;
    updateDateInputs();
}

function updateDateInputs() {
    const startInput = document.getElementById('startDateInput');
    const endInput = document.getElementById('endDateInput');
    if (startInput && state.filters.startDate) {
        startInput.value = state.filters.startDate.toISOString().slice(0, 10);
    }
    if (endInput && state.filters.endDate) {
        endInput.value = state.filters.endDate.toISOString().slice(0, 10);
    }
}

function handlePresetChange(e) {
    const preset = e.target.value;
    if (preset !== 'custom') {
        setPresetDates(preset);
        applyFiltersFromInputs();
    } else {
        state.filters.preset = 'custom';
    }
}

function getSelectedValues(select) {
    return select ? Array.from(select.selectedOptions).map(o => o.value) : [];
}

function applyFiltersFromInputs() {
    const presetSelect = document.getElementById('dateRangePreset');
    const preset = presetSelect ? presetSelect.value : state.filters.preset;

    if (preset === 'custom') {
        state.filters.preset = 'custom';
        const startInput = document.getElementById('startDateInput');
        const endInput = document.getElementById('endDateInput');
        state.filters.startDate = startInput?.value ? new Date(startInput.value + 'T00:00:00') : null;
        state.filters.endDate = endInput?.value ? new Date(endInput.value + 'T23:59:59') : null;
    } else {
        setPresetDates(preset);
    }

    state.filters.severities = new Set(getSelectedValues(document.getElementById('severityFilter')));
    state.filters.statuses = new Set(getSelectedValues(document.getElementById('statusFilter')));
    state.filters.events = new Set(getSelectedValues(document.getElementById('eventFilter')));

    updateDashboard();
}

function resetFilters() {
    state.filters = { preset: 'last30', startDate: null, endDate: null, severities: new Set(), statuses: new Set(), events: new Set() };

    const presetSelect = document.getElementById('dateRangePreset');
    if (presetSelect) presetSelect.value = 'last30';

    ['severityFilter', 'statusFilter', 'eventFilter'].forEach(id => {
        const select = document.getElementById(id);
        if (select) Array.from(select.options).forEach(o => o.selected = false);
    });

    setPresetDates('last30');
    updateDashboard();
}

function exportFilteredData() {
    if (!state.filteredAlerts.length) {
        alert('No filtered alerts to export.');
        return;
    }

    const header = ['identifier', 'sent', 'expires', 'severity', 'status', 'event'];
    const rows = state.filteredAlerts.map(a => [
        `"${a.id || ''}"`,
        a.sentDate?.toISOString() || '',
        a.expiresDate?.toISOString() || '',
        `"${a.severity}"`,
        `"${a.status}"`,
        `"${a.event}"`
    ].join(','));

    const blob = new Blob([[header.join(','), ...rows].join('\n')], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'filtered_alerts.csv';
    link.click();
}

// ============================================
// SYSTEM DATE MANAGEMENT
// ============================================

function updateSystemStartDate() {
    const input = document.getElementById('systemStartDate');
    if (input && input.value) {
        state.systemStartDate = input.value;
        localStorage.setItem('statsSystemStartDate', input.value);
        updateSystemInfo();
    }
}

function resetSystemStartDate() {
    state.systemStartDate = '2024-01-01';
    localStorage.removeItem('statsSystemStartDate');
    const input = document.getElementById('systemStartDate');
    if (input) input.value = state.systemStartDate;
    updateSystemInfo();
}

// ============================================
// UI UPDATES
// ============================================

function updateFilterSummary(alerts) {
    const summary = document.getElementById('filterSummary');
    if (!summary) return;

    const fmt = new Intl.NumberFormat();
    const parts = [`<strong>${fmt.format(alerts.length)}</strong> alerts match current filters.`];

    if (state.filters.startDate || state.filters.endDate) {
        const start = state.filters.startDate?.toLocaleDateString() || 'beginning';
        const end = state.filters.endDate?.toLocaleDateString() || 'now';
        parts.push(`<span class="filter-pill"><i class="fas fa-calendar"></i> ${start} - ${end}</span>`);
    }
    if (state.filters.severities.size) {
        parts.push(`<span class="filter-pill"><i class="fas fa-exclamation-triangle"></i> ${[...state.filters.severities].join(', ')}</span>`);
    }

    summary.innerHTML = parts.join(' ');
}

function updateQuickStats(agg) {
    const fmt = new Intl.NumberFormat();

    const els = {
        filteredTotalAlerts: fmt.format(agg.totalAlerts),
        filteredAvgPerDay: agg.avgPerDay?.toFixed(1) || '0',
        filteredTopSeverity: agg.topSeverity || '-',
        filteredTopEvent: agg.topEvent || '-'
    };

    Object.entries(els).forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
    });
}

function updateSystemInfo() {
    const timestampEl = document.getElementById('stats-timestamp');
    if (timestampEl) timestampEl.textContent = new Date().toLocaleString();

    const uptimeEl = document.getElementById('uptime-days');
    if (uptimeEl) {
        const startDate = new Date(state.systemStartDate + 'T00:00:00');
        const now = new Date();
        const days = Math.max(0, Math.floor((now - startDate) / (1000 * 60 * 60 * 24)));
        uptimeEl.textContent = days.toLocaleString();
    }

    const startInput = document.getElementById('systemStartDate');
    if (startInput && !startInput.value) {
        startInput.value = state.systemStartDate;
    }
}

// ============================================
// DATA AGGREGATION
// ============================================

function getFilteredAlerts() {
    const start = state.filters.startDate ? new Date(state.filters.startDate) : null;
    const end = state.filters.endDate ? new Date(state.filters.endDate) : null;
    if (start) start.setHours(0, 0, 0, 0);
    if (end) end.setHours(23, 59, 59, 999);

    return baseAlerts.filter(alert => {
        if (start && alert.sentDate < start) return false;
        if (end && alert.sentDate > end) return false;
        if (state.filters.severities.size && !state.filters.severities.has(alert.severity)) return false;
        if (state.filters.statuses.size && !state.filters.statuses.has(alert.status)) return false;
        if (state.filters.events.size && !state.filters.events.has(alert.event)) return false;
        return true;
    });
}

function aggregateAlerts(alerts) {
    const eventCounts = new Map();
    const severityCounts = new Map();
    const statusCounts = new Map();
    const hourlyTotals = Array(24).fill(0);
    const monthlyTotals = Array(12).fill(0);
    const yearlyCounts = new Map();
    const hourlyMatrix = Array.from({ length: 7 }, () => Array(24).fill(0));
    const dailyCounts = new Map();

    alerts.forEach(alert => {
        const sent = alert.sentDate;
        if (!sent) return;

        const dayKey = sent.toISOString().slice(0, 10);
        const hour = sent.getHours();
        const dow = sent.getDay();
        const month = sent.getMonth();
        const year = sent.getFullYear();

        eventCounts.set(alert.event || 'Unknown', (eventCounts.get(alert.event) || 0) + 1);
        severityCounts.set(alert.severity || 'Unknown', (severityCounts.get(alert.severity) || 0) + 1);
        statusCounts.set(alert.status || 'Unknown', (statusCounts.get(alert.status) || 0) + 1);

        hourlyTotals[hour]++;
        hourlyMatrix[dow][hour]++;
        monthlyTotals[month]++;
        yearlyCounts.set(year, (yearlyCounts.get(year) || 0) + 1);
        dailyCounts.set(dayKey, (dailyCounts.get(dayKey) || 0) + 1);
    });

    const dailySeries = [...dailyCounts.entries()]
        .sort((a, b) => new Date(a[0]) - new Date(b[0]))
        .map(([date, count]) => ({ date, count }));

    const alertByEvent = [...eventCounts.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .map(([event, count]) => ({ event, count }));

    const alertBySeverity = [...severityCounts.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([severity, count]) => ({ severity, count }));

    const alertByStatus = [...statusCounts.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([status, count]) => ({ status, count }));

    const yearlyTotals = [...yearlyCounts.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([year, count]) => ({ year, count }));

    const dowTotals = hourlyMatrix.map(row => row.reduce((a, b) => a + b, 0));

    return {
        totalAlerts: alerts.length,
        alertByEvent,
        alertBySeverity,
        alertByStatus,
        hourlyTotals,
        hourlyMatrix,
        dowTotals,
        monthlyTotals,
        yearlyTotals,
        dailySeries,
        recentByDay: dailySeries.slice(-30),
        avgPerDay: dailySeries.length ? dailySeries.reduce((a, b) => a + b.count, 0) / dailySeries.length : 0,
        topSeverity: alertBySeverity[0]?.severity || '-',
        topEvent: alertByEvent[0]?.event || '-'
    };
}

// ============================================
// CHART UTILITIES
// ============================================

function createOrUpdateChart(containerId, factory) {
    const container = document.getElementById(containerId);
    if (!container) return;

    if (state.charts[containerId]) {
        state.charts[containerId].destroy();
    }

    container.innerHTML = '';
    const canvas = document.createElement('canvas');
    container.appendChild(canvas);

    const chart = factory(canvas);
    if (chart) state.charts[containerId] = chart;
}

function showNoData(containerId, message) {
    const container = document.getElementById(containerId);
    if (!container) return;

    if (state.charts[containerId]) {
        state.charts[containerId].destroy();
        delete state.charts[containerId];
    }

    container.innerHTML = `<div class="simple-chart"><i class="fas fa-chart-bar"></i><span>${message}</span></div>`;
}

// ============================================
// CHART CREATION FUNCTIONS
// ============================================

function createAlertTypesChart(agg) {
    const id = 'alertTypesChart';
    if (!document.getElementById(id)) return;
    if (!agg.alertByEvent.length) return showNoData(id, 'No alert data available');

    createOrUpdateChart(id, canvas => {
        const ctx = canvas.getContext('2d');
        return new Chart(canvas, {
            type: 'doughnut',
            data: {
                labels: agg.alertByEvent.map(i => i.event),
                datasets: [{
                    data: agg.alertByEvent.map(i => i.count),
                    backgroundColor: agg.alertByEvent.map((_, i) => {
                        const colors = CHART_GRADIENTS[i % CHART_GRADIENTS.length];
                        return createRadialGradient(ctx, colors);
                    }),
                    borderWidth: 0,
                    hoverOffset: 8
                }]
            },
            options: {
                cutout: '60%',
                plugins: {
                    legend: { position: 'right', labels: { padding: 15, usePointStyle: true } },
                    datalabels: {
                        display: true,
                        color: getCSSVar('--surface-color', '#ffffff'),
                        font: { weight: 'bold', size: 11 },
                        formatter: (val, ctx) => {
                            const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                            return `${((val / total) * 100).toFixed(0)}%`;
                        }
                    }
                }
            }
        });
    });
}

function createSeverityChart(agg) {
    const id = 'severityChart';
    if (!document.getElementById(id)) return;
    if (!agg.alertBySeverity.length) return showNoData(id, 'No severity data');

    const severityGradients = {
        'Extreme': GRADIENT_PALETTES.danger,
        'Severe': GRADIENT_PALETTES.orange,
        'Moderate': GRADIENT_PALETTES.warning,
        'Minor': GRADIENT_PALETTES.info,
        'Unknown': [getCSSVar('--text-muted', '#94a3b8'), getCSSVar('--border-color', '#64748b')]
    };

    createOrUpdateChart(id, canvas => {
        const ctx = canvas.getContext('2d');
        return new Chart(canvas, {
            type: 'bar',
            data: {
                labels: agg.alertBySeverity.map(i => i.severity),
                datasets: [{
                    label: 'Alerts',
                    data: agg.alertBySeverity.map(i => i.count),
                    backgroundColor: agg.alertBySeverity.map(i => {
                        const colors = severityGradients[i.severity] || severityGradients.Unknown;
                        return createGradient(ctx, colors);
                    }),
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: getChartThemeColors().gridLines } },
                    x: { grid: { display: false } }
                }
            }
        });
    });
}

function createStatusChart(agg) {
    const id = 'statusChart';
    if (!document.getElementById(id)) return;
    if (!agg.alertByStatus.length) return showNoData(id, 'No status data');

    createOrUpdateChart(id, canvas => {
        const ctx = canvas.getContext('2d');
        return new Chart(canvas, {
            type: 'pie',
            data: {

function createTemporalHeatmapChart(agg) {
    const id = 'temporalHeatmapChart';
    const container = document.getElementById(id);
    if (!container) return;

    const matrix = agg.hourlyMatrix || [];
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const data = [];
    let maxVal = 0;

    matrix.forEach((row, dow) => {
        row.forEach((val, hour) => {
            data.push({ x: hour, y: dow, v: val || 0 });
            if (val > maxVal) maxVal = val;
        });
    });

    if (!data.some(p => p.v > 0)) return showNoData(id, 'No activity data');

    createOrUpdateChart(id, canvas => new Chart(canvas, {
        type: 'matrix',
        data: {
            datasets: [{
                label: 'Alerts',
                data,
                backgroundColor: ctx => getHeatmapColor(ctx.dataset.data[ctx.dataIndex].v, maxVal),
                borderWidth: 2,
                borderColor: getChartThemeColors().surface,
                borderRadius: 4,
                width: ({ chart }) => (chart.chartArea?.width || 600) / 24 - 3,
                height: ({ chart }) => (chart.chartArea?.height || 300) / 7 - 3
            }]
        },
        options: {
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        title: () => '',
                        label: ctx => {
                            const d = ctx.dataset.data[ctx.dataIndex];
                            return `${dayNames[d.y]} ${d.x}:00 - ${d.v} alerts`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    type: 'linear',
                    min: -0.5,
                    max: 23.5,
                    ticks: { stepSize: 1, callback: v => `${v}:00` },
                    grid: { display: false }
                },
                y: {
                    type: 'linear',
                    min: -0.5,
                    max: 6.5,
                    reverse: true,
                    ticks: { stepSize: 1, callback: v => dayNames[v] },
                    grid: { display: false }
                }
            }
        }
    }));

    // Add legend
    const legendHtml = `
        <div class="heatmap-legend">
            <span>Less</span>
            <div class="heatmap-gradient"></div>
            <span>More</span>
        </div>
    `;
    const legendDiv = document.createElement('div');
    legendDiv.innerHTML = legendHtml;
    container.appendChild(legendDiv);
}

    createOrUpdateChart(id, canvas => {
        const ctx = canvas.getContext('2d');
        return new Chart(canvas, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [rate, 1 - rate],
                    backgroundColor: [createGradient(ctx, color), getCSSVar('--glass-bg', 'rgba(0,0,0,0.05)')],
                    borderWidth: 0,
                    circumference: 180,
                    rotation: 270
                }]
            },
            options: {
                cutout: '75%',
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            },
            plugins: [{
                id: 'gaugeText',
                afterDraw(chart) {
                    const { ctx, chartArea: { width, height } } = chart;
                    ctx.save();
                    ctx.font = 'bold 32px Inter, sans-serif';
                    ctx.fillStyle = getChartThemeColors().text;
                    ctx.textAlign = 'center';
                    ctx.fillText(`${pct}%`, width / 2, height / 2 + 30);
                    ctx.font = '14px Inter, sans-serif';
                    ctx.fillStyle = getChartThemeColors().textMuted;
                    ctx.fillText('Reliability', width / 2, height / 2 + 55);
                    ctx.restore();
                }
            }]
        });
    });
}

function initializeFilters() {
    populateFilterSelect('severityFilter', statsData.filterOptions.severities || []);
    populateFilterSelect('statusFilter', statsData.filterOptions.statuses || []);
    populateFilterSelect('eventFilter', statsData.filterOptions.events || []);

    document.getElementById('dateRangePreset')?.addEventListener('change', handlePresetChange);
    document.getElementById('applyFiltersBtn')?.addEventListener('click', applyFiltersFromInputs);
    document.getElementById('resetFiltersBtn')?.addEventListener('click', resetFilters);
    document.getElementById('exportDashboardBtn')?.addEventListener('click', exportFilteredData);
    document.getElementById('exportDashboardPdfBtn')?.addEventListener('click', exportDashboardAsPdf);
    initializeExportDropdown();
    document.getElementById('updateStartDateBtn')?.addEventListener('click', updateSystemStartDate);
    document.getElementById('resetStartDateBtn')?.addEventListener('click', resetSystemStartDate);

    setPresetDates('last30');
}

function initializeDashboard() {
    if (window.__statsDashboardInitialized) return;
    window.__statsDashboardInitialized = true;

    initializeFilters();
    updateSystemInfo();
    updateDashboard();

    console.log('Dashboard ready');
}

document.addEventListener('DOMContentLoaded', () => {
    try {
        initializeDashboard();
    } catch (error) {
        console.error('Dashboard initialization failed:', error);
        const root = document.getElementById('statisticsDashboardRoot');
        if (root) {
            root.innerHTML = `<div class="alert alert-danger m-3"><strong>Dashboard Error:</strong> ${error.message}</div>`;
        }
    }
});

// Theme change listener
window.addEventListener('theme-changed', () => {
    applyChartTheme();
    Object.values(state.charts).forEach(c => c?.destroy());
    state.charts = {};
    state.staticChartsInitialized = false;
    if (state.aggregates) updateDashboard();
});

function computeStreakStats() {
    const dailyData = statsData.dailyAlerts || [];
    if (!dailyData.length) return;

    // Build a Set of dates with alerts
    const alertDates = new Set(dailyData.filter(d => d.count > 0).map(d => d.date));

    if (!alertDates.size) return;

    const allDates = dailyData.map(d => d.date).sort();
    const firstDate = new Date(allDates[0]);
    const lastDate = new Date(allDates[allDates.length - 1]);

    let longestActive = 0, currentActive = 0;
    let longestQuiet = 0, currentQuiet = 0;

    const cursor = new Date(firstDate);
    while (cursor <= lastDate) {
        const key = cursor.toISOString().slice(0, 10);
        if (alertDates.has(key)) {
            currentActive++;
            currentQuiet = 0;
        } else {
            currentQuiet++;
            currentActive = 0;
        }
        longestActive = Math.max(longestActive, currentActive);
        longestQuiet = Math.max(longestQuiet, currentQuiet);
        cursor.setDate(cursor.getDate() + 1);
    }

    const activeEl = document.getElementById('longestActiveStreak');
    const quietEl = document.getElementById('longestQuietPeriod');
    if (activeEl) activeEl.textContent = longestActive > 0 ? `${longestActive}d` : '-';
    if (quietEl) quietEl.textContent = longestQuiet > 0 ? `${longestQuiet}d` : '-';
}

const SEVERITY_GRADIENTS = {
    'Extreme':  GRADIENT_PALETTES.danger,
    'Severe':   GRADIENT_PALETTES.orange,
    'Moderate': GRADIENT_PALETTES.warning,
    'Minor':    GRADIENT_PALETTES.info,
    'Unknown':  GRADIENT_PALETTES.indigo
};

const SEVERITY_ORDER = ['Extreme', 'Severe', 'Moderate', 'Minor', 'Unknown'];

function expandDailyKeys(alerts) {
    if (!alerts.length) return [];
    const dates = alerts.map(a => a.sentDate).sort((a, b) => a - b);
    const start = new Date(dates[0]); start.setHours(0, 0, 0, 0);
    const end = new Date(dates[dates.length - 1]); end.setHours(0, 0, 0, 0);
    // Cap range to ~5 years to avoid runaway loops on misconfigured filters.
    // Multi-year filters are legitimate; decades of contiguous days would just
    // produce an unreadable chart and waste browser memory.
    const MAX_DAILY_BUCKETS = 366 * 5;
    const out = [];
    const cursor = new Date(start);
    let i = 0;
    while (cursor <= end && i < MAX_DAILY_BUCKETS) {
        out.push(cursor.toISOString().slice(0, 10));
        cursor.setDate(cursor.getDate() + 1);
        i++;
    }
    return out;
}

function createYoYComparisonChart() {
    const id = 'yoyComparisonChart';
    const wrapper = document.getElementById('yoyChartWrapper');
    if (!document.getElementById(id)) return;

    // Year-over-year only meaningful when at least one full prior year exists
    if (baseAlerts.length < 2) {
        if (wrapper) wrapper.style.display = 'none';
        return;
    }
    const years = new Set(baseAlerts.map(a => a.sentDate.getFullYear()));
    if (years.size < 2) {
        if (wrapper) wrapper.style.display = 'none';
        return;
    }
    if (wrapper) wrapper.style.display = '';

    const start = state.filters.startDate ? new Date(state.filters.startDate) : null;
    const end = state.filters.endDate ? new Date(state.filters.endDate) : null;
    if (!start || !end) return showNoData(id, 'Select a date range');

    // Build day-of-year buckets for current window vs same window shifted back 1 year.
    const fmtDayKey = (d) => `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const labels = [];
    const cursor = new Date(start); cursor.setHours(0, 0, 0, 0);
    const endCap = new Date(end); endCap.setHours(0, 0, 0, 0);
    let safety = 0;
    while (cursor <= endCap && safety < 400) {
        labels.push(fmtDayKey(cursor));
        cursor.setDate(cursor.getDate() + 1);
        safety++;
    }

    const thisYearCounts = Object.fromEntries(labels.map(l => [l, 0]));
    const lastYearCounts = Object.fromEntries(labels.map(l => [l, 0]));
    const startKey = +start, endKey = +endCap + 86400000 - 1;
    const startPrev = +(new Date(start.getFullYear() - 1, start.getMonth(), start.getDate(), 0, 0, 0, 0));
    const endPrev = +(new Date(end.getFullYear() - 1, end.getMonth(), end.getDate(), 23, 59, 59, 999));

    baseAlerts.forEach(a => {
        const t = +a.sentDate;
        const k = fmtDayKey(a.sentDate);
        if (t >= startKey && t <= endKey && thisYearCounts[k] !== undefined) thisYearCounts[k]++;
        else if (t >= startPrev && t <= endPrev && lastYearCounts[k] !== undefined) lastYearCounts[k]++;
    });

    const thisTotal = Object.values(thisYearCounts).reduce((a, b) => a + b, 0);
    const lastTotal = Object.values(lastYearCounts).reduce((a, b) => a + b, 0);
    if (thisTotal === 0 && lastTotal === 0) return showNoData(id, 'No comparable prior-year data');

    createOrUpdateChart(id, canvas => {
        const ctx = canvas.getContext('2d');
        return new Chart(canvas, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    {
                        label: `${start.getFullYear()} (current window)`,
                        data: labels.map(l => thisYearCounts[l]),
                        borderColor: GRADIENT_PALETTES.primary[0],
                        backgroundColor: GRADIENT_PALETTES.primary[0] + '33',
                        borderWidth: 2.5, tension: 0.3, pointRadius: 0, fill: false
                    },
                    {
                        label: `${start.getFullYear() - 1} (prior year)`,
                        data: labels.map(l => lastYearCounts[l]),
                        borderColor: GRADIENT_PALETTES.warning[0],
                        backgroundColor: GRADIENT_PALETTES.warning[0] + '22',
                        borderWidth: 2, borderDash: [6, 4], tension: 0.3, pointRadius: 0, fill: false
                    }
                ]
            },
            options: {
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { maxTicksLimit: 10, autoSkip: true } },
                    y: { beginAtZero: true, grid: { color: getChartThemeColors().gridLines } }
                }
            }
        });
    });
}

function initializeExportDropdown() {
    const dd = document.getElementById('exportDropdown');
    if (!dd) return;
    const toggle = document.getElementById('exportToggleBtn');
    if (!toggle) return;

    toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = dd.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(isOpen));
    });
    document.addEventListener('click', (e) => {
        if (!dd.contains(e.target)) {
            dd.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            dd.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
        }
    });
    // Close after clicking any menu item.
    dd.querySelectorAll('.export-menu button, .export-menu a').forEach(el => {
        el.addEventListener('click', () => {
            dd.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
        });
    });
}

async function exportDashboardAsPdf() {
    if (typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF) {
        alert('PDF library failed to load. Please refresh the page and try again.');
        return;
    }
    const { jsPDF } = window.jspdf;
    showPdfOverlay(true);
    setPdfStatus('Preparing report…');

    try {
        // A4 portrait: 210 x 297 mm
        const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const margin = 12;
        const contentW = pageW - margin * 2;
        let cursorY = margin;

        const ensureSpace = (needed) => {
            if (cursorY + needed > pageH - margin) {
                doc.addPage();
                cursorY = margin;
                drawPageHeader();
            }
        };

        const drawPageHeader = () => {
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(120);
            doc.text('EAS Station ™ — Statistics Report', margin, 8);
            doc.text(new Date().toLocaleString(), pageW - margin, 8, { align: 'right' });
            doc.setDrawColor(220);
            doc.line(margin, 10, pageW - margin, 10);
            doc.setTextColor(20);
        };

        // ---------------- Cover page ----------------
        doc.setFillColor(102, 126, 234);
        doc.rect(0, 0, pageW, 70, 'F');
        doc.setTextColor(255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(26);
        doc.text('EAS Station ™', margin, 28);
        doc.setFontSize(18);
        doc.text('Statistics Report', margin, 40);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        doc.text(describeFilterRange(), margin, 52);
        doc.text(`Generated: ${new Date().toLocaleString()}`, margin, 60);

        cursorY = 84;
        doc.setTextColor(20);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.text('Summary', margin, cursorY);
        cursorY += 6;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);

        const meta = statsData.pageMeta || {};
        const agg = state.aggregates || {};
        const summaryRows = [
            ['Total alerts (all time)',   String(meta.totalAlerts ?? '—')],
            ['Active alerts',             String(meta.activeAlerts ?? '—')],
            ['Expired alerts',            String(meta.expiredAlerts ?? '—')],
            ['Boundaries tracked',        String(meta.totalBoundaries ?? '—')],
            ['Alerts in selected range',  String((state.filteredAlerts || []).length)],
            ['Avg per day (range)',       (agg.avgPerDay || 0).toFixed(2)],
            ['Top severity (range)',      String(agg.topSeverity || '—')],
            ['Most common event (range)', String(agg.topEvent || '—')]
        ];
        const colW = contentW / 2;
        summaryRows.forEach(([k, v], i) => {
            const col = i % 2;
            const row = Math.floor(i / 2);
            const x = margin + col * colW;
            const y = cursorY + row * 7;
            doc.setTextColor(110);
            doc.text(k, x, y);
            doc.setTextColor(20);
            doc.setFont('helvetica', 'bold');
            doc.text(v, x + colW - 4, y, { align: 'right' });
            doc.setFont('helvetica', 'normal');
        });
        cursorY += Math.ceil(summaryRows.length / 2) * 7 + 6;

        // ---------------- Charts ----------------
        const chartsToInclude = [
            { id: 'alertTypesChart',         title: 'By Alert Type' },
            { id: 'severityChart',           title: 'By Severity' },
            { id: 'severityOverTimeChart',   title: 'Severity Mix Over Time' },
            { id: 'cumulativeAlertsChart',   title: 'Cumulative Alerts' },
            { id: 'topEventsTrendChart',     title: 'Top 5 Event Types Trend' },
            { id: 'hourSeverityChart',       title: 'Hour-of-Day × Severity' },
            { id: 'temporalHeatmapChart',    title: 'Activity Heatmap (Day × Hour)' },
            { id: 'hourlyLineChart',         title: 'Hourly Distribution' },
            { id: 'dayOfWeekChart',          title: 'Weekly Trend' },
            { id: 'monthlyChart',            title: 'Monthly Trend' },
            { id: 'recentActivityChart',     title: 'Recent Activity' },
            { id: 'yearlyTrendChart',        title: 'Yearly Trend' },
            { id: 'leadTimeHistogramChart',  title: 'Alert Duration Distribution' },
            { id: 'yoyComparisonChart',      title: 'Year-over-Year Comparison' },
            { id: 'forwardingFunnelChart',   title: 'EAS Forwarding Funnel' },
            { id: 'affectedAreasChart',      title: 'Most Affected Areas' },
            { id: 'boundaryTypesChart',      title: 'Boundary Types' },
            { id: 'reliabilityGauge',        title: 'Reliability Score' },
            { id: 'durationChart',           title: 'Avg Alert Duration' },
            { id: 'messageTypeChart',        title: 'Message Type Breakdown' },
            { id: 'pollingTrendChart',       title: 'Polling Reliability Trend' },
            { id: 'urgencyChart',            title: 'By Urgency' },
            { id: 'certaintyChart',          title: 'By Certainty' },
            { id: 'statusChart',             title: 'By Status' },
            { id: 'relayActivationsChart',   title: 'Relay Activations by Type' }
        ];

        const chartImgW = contentW;
        const chartImgH = 75; // mm

        for (let i = 0; i < chartsToInclude.length; i++) {
            const item = chartsToInclude[i];
            const chart = state.charts[item.id];
            if (!chart) continue;
            setPdfStatus(`Rendering chart ${i + 1}/${chartsToInclude.length}: ${item.title}`);
            // Yield to the event loop so the overlay can repaint.
            await new Promise(r => setTimeout(r, 0));

            ensureSpace(chartImgH + 10);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(30);
            doc.text(item.title, margin, cursorY);
            cursorY += 4;

            let dataUrl;
            try {
                dataUrl = chart.toBase64Image('image/png', 1.0);
            } catch (err) {
                console.warn('Failed to render chart', item.id, err);
                continue;
            }
            try {
                doc.addImage(dataUrl, 'PNG', margin, cursorY, chartImgW, chartImgH, undefined, 'FAST');
            } catch (err) {
                console.warn('addImage failed', item.id, err);
                continue;
            }
            cursorY += chartImgH + 8;
        }

        // ---------------- Top boundaries table ----------------
        const boundaryRows = (statsData.mostAffectedBoundaries || []).slice(0, 12);
        if (boundaryRows.length) {
            ensureSpace(20 + boundaryRows.length * 6);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.text('Top affected boundaries', margin, cursorY);
            cursorY += 6;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9);
            doc.setFillColor(240, 240, 245);
            doc.rect(margin, cursorY - 4, contentW, 6, 'F');
            doc.text('Boundary', margin + 2, cursorY);
            doc.text('Type', margin + contentW * 0.55, cursorY);
            doc.text('Alerts', margin + contentW - 4, cursorY, { align: 'right' });
            cursorY += 4;
            doc.setFont('helvetica', 'normal');
            boundaryRows.forEach(b => {
                ensureSpace(6);
                cursorY += 5;
                doc.text(String(b.name || '—').slice(0, 60), margin + 2, cursorY);
                doc.text(String(b.type || '—'), margin + contentW * 0.55, cursorY);
                doc.text(String(b.count || 0), margin + contentW - 4, cursorY, { align: 'right' });
            });
            cursorY += 6;
        }

        setPdfStatus('Finalizing…');
        // Add page numbers
        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(120);
            doc.text(`Page ${i} / ${pageCount}`, pageW - margin, pageH - 5, { align: 'right' });
        }

        const today = new Date();
        const ymd = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
        const rangeSlug = (state.filters.preset || 'custom').replace(/[^a-z0-9]/gi, '');
        doc.save(`eas-station-statistics_${ymd}_${rangeSlug}.pdf`);
    } catch (err) {
        console.error('PDF export failed:', err);
        alert('Could not generate PDF: ' + (err && err.message ? err.message : err));
    } finally {
        showPdfOverlay(false);
    }
}
</script>
