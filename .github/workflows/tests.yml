name: Tests

# Runs the full pytest suite on every pull request and on pushes to the
# long-lived branches.
#
# Before this workflow existed, CI ran exactly one test file
# (tests/test_release_metadata.py, via release-metadata.yml) plus the template
# block check — so ~1,700 tests across 147 files never gated a merge.
#
# The suite needs no external services by default: tests/conftest.py seeds
# DATABASE_URL=sqlite:///:memory: and SKIP_DB_INIT=1 at import time. Redis is
# provided as a service container because a handful of audio/coordination tests
# talk to a real Redis rather than a mock.

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same branch; a stale result helps nobody.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Python 3.13 only -- the sole supported runtime. See README.md's
        # System Requirements table.
        python-version: ['3.13']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # PostGIS, not plain PostgreSQL: CAPAlert carries a geometry column, so
      # the alert-query tests cannot run against SQLite. Tests that do not need
      # a database still use the in-memory SQLite default from conftest.py.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages
        # ffmpeg backs the audio-source tests; libsndfile is needed by soundfile.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Create database schema
        # The postgres service starts empty apart from the PostGIS extensions,
        # so tests that hit a real database (tests/test_alert_active_expired_
        # partition.py and friends) died with UndefinedTable: cap_alerts.
        #
        # This mirrors install.sh and .claude/hooks/session-start.sh:
        #
        #   1. db.create_all()     build the current schema from the models
        #   2. alembic stamp head  record that the database is at head
        #
        # `alembic upgrade head` is deliberately NOT used: no migration in
        # app_core/migrations/versions/ creates the base tables, so replaying
        # the chain against an empty database fails on the first migration
        # that references cap_alerts. The chain is incremental-only and
        # assumes the model-built schema already exists.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eas_test
          SECRET_KEY: ci-secret-key-not-for-production-use-only-0123456789
          SKIP_DB_INIT: '1'
          LOG_LEVEL: ERROR
        run: |
          python -c "
          from app import app
          from app_core.extensions import db
          with app.app_context():
              db.create_all()
          "
          python -m alembic stamp head

      - name: Run test suite
        # Tests listed in tests/known_failures.txt are marked xfail by
        # conftest.py rather than skipped, so they still execute: when one
        # starts passing it reports XPASS and the entry can be deleted. The
        # list is meant to shrink to nothing.
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Tests that need a real database read this; conftest.py only applies
          # its sqlite:///:memory: default when DATABASE_URL is unset.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eas_test
          SECRET_KEY: ci-secret-key-not-for-production-use-only-0123456789
        run: |
          python -m pytest tests/ \
            --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        # The enforced rule set is intentionally narrow (see pyproject.toml):
        # only rules the codebase is already clean against, so a failure here
        # always means a new regression rather than pre-existing debt.
        run: ruff check .
