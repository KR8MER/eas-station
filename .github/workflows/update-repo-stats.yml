name: Update Repository Statistics

# Regenerates static/repo_stats.html on a daily schedule (or on demand).
# This workflow intentionally does NOT commit back to the repository — it
# only verifies that the generator runs cleanly. Refresh the committed stats
# file locally with `python scripts/generate_repo_stats.py` when you want the
# changes persisted, keeping the Actions history and git log free of automated
# "Update repository statistics" churn.

on:
  schedule:
    # Run daily at 00:00 UTC to keep statistics fresh
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate repository statistics
      run: |
        python scripts/generate_repo_stats.py

    - name: Report drift
      run: |
        if git diff --quiet static/repo_stats.html; then
          echo "::notice::Repository statistics are up to date."
        else
          echo "::notice::static/repo_stats.html is out of date — run 'python scripts/generate_repo_stats.py' locally and commit the result to refresh it."
        fi
