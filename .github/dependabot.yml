version: 2
updates:
  # requirements.txt / requirements-sdr.txt -- pinned Python dependencies.
  # requirements-system.txt is apt package names, not pip specifiers, so
  # Dependabot has nothing to act on there.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # One weekly PR for every pip bump. boto3/botocore/aiobotocore and
      # s3fs/fsspec pin each other's exact versions, so bumped one at a
      # time each PR fails to resolve; and every PR gets a release commit
      # (VERSION + CHANGELOG) from .github/workflows/dependabot-sync.yml,
      # so two open Dependabot PRs would conflict with each other.
      python-deps:
        patterns:
          - "*"
    ignore:
      # redis-py 8.x leaks one list per pub/sub message with hiredis (see
      # requirements.txt). Re-test with tests/test_redis_pubsub_leak_pin.py
      # before lifting this.
      - dependency-name: "redis"
        versions: [">=8"]

  # Keep the actions pinned in .github/workflows/*.yml (actions/checkout,
  # actions/setup-python, github/codeql-action, etc.) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
